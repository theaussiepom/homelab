schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: api
    trust:
      ca_file: /example/ca.pem
      known_hosts: /example/known_hosts
    credentials:
      api_token: token
      ssh_private_key: ssh
    paths:
      state_root: /example/state
      backup_directory: /example/backup/data
      backup_mount: /example/backup
      backup_source: example:/backup
    protected_guests:
    - 9900
    - 9914
    - 9915
    - 9920
    ssh_public_keys: []
    dns_servers:
    - external: dns
secret_sources:
  token:
    type: file
    path: /never-read/token
  ssh:
    type: file
    path: /never-read/ssh
  pbs-management:
    type: environment
    name: PBS_API_TOKEN
external_endpoints:
  api:
    protocol: https
    address: 192.0.2.10
    port: 8006
  dns:
    protocol: udp
    address: 198.18.21.53
    port: 53
  pbs:
    protocol: https
    address: 192.0.2.50
    port: 8007
networks:
  primary:
    context: lab
    cidr: 198.18.20.0/24
    bridge: example0
    vlan: null
    gateway: 198.18.20.1
  secondary:
    context: lab
    cidr: 198.18.21.0/24
    bridge: example1
    vlan: 121
    gateway: 198.18.21.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  resolver:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 610
      hostname: example-dns
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: management
    interfaces:
      management:
        network: primary
        slot: 0
        mac: 02:00:00:20:00:10
        address:
          mode: static
          value: 198.18.20.10
        default_route: true
        ipv6: manual
      backend:
        network: secondary
        slot: 1
        mac: 02:00:00:21:00:10
        address:
          mode: static
          value: 198.18.21.10
        ipv6: manual
    backup: null
    volumes:
      backup-stage:
        storage: local
        slot: 0
        path: /srv/backup-stage
        size_gib: 1
apps:
  recursive_a:
    profile: recursive
    guest: resolver
    lifecycle: fresh
    interfaces:
      private:
        scope: app-network
        network: default
      local:
        scope: guest-loopback
backup:
  management:
    credential: pbs-management
    datastore_path: /mnt/backup/recovery
  recovery_public_key:
    source: assets/master-public.pem.fixture
  job:
    name: example-recovery
    destination:
      endpoint:
        external: pbs
      datastore: recovery
      namespace: guests
      fingerprint: ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab
    schedule:
      calendar: 02:00
      jitter_seconds: 300
    clients:
      resolver:
        staging_volume: backup-stage
        interface: management
    capture:
      pause: []
      database_lock: []
      influx_tokens: {}
    limits:
      max_bytes: 33554432
      max_files: 10000
      timeout_seconds: 300
