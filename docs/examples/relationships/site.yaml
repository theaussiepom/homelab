schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: api
    trust:
      ca_file: /example/ca.pem
      known_hosts: /example/known_hosts
    credentials:
      api_token: token
      ssh_private_key: ssh
    paths:
      state_root: /example/state
      backup_directory: /example/backup/data
      backup_mount: /example/backup
      backup_source: example:/backup
    protected_guests:
    - 9900
    - 9914
    - 9915
    - 9920
    ssh_public_keys: []
    dns_servers:
    - external: dns
secret_sources:
  token:
    type: file
    path: /never-read/token
  ssh:
    type: file
    path: /never-read/ssh
  probe:
    type: file
    path: /never-read/probe.json
  provider:
    type: file
    path: /never-read/provider.json
  dns_api:
    type: environment
    name: EXAMPLE_DNS_TOKEN
  browser_password:
    type: generated
    credential_id: example-browser-password
external_endpoints:
  api:
    protocol: https
    address: 192.0.2.10
    port: 8006
  dns:
    protocol: udp
    address: 198.18.21.53
    port: 53
  outpost:
    protocol: http
    address: 192.0.2.20
    port: 9000
  existing_broker:
    protocol: tcp
    address: 192.0.2.77
    port: 1883
networks:
  primary:
    context: lab
    cidr: 198.18.20.0/24
    bridge: example0
    vlan: null
    gateway: 198.18.20.1
  secondary:
    context: lab
    cidr: 198.18.21.0/24
    bridge: example1
    vlan: 121
    gateway: 198.18.21.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  resolver:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 610
      hostname: example-dns
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: management
    interfaces:
      management:
        network: primary
        slot: 0
        mac: 02:00:00:20:00:10
        address:
          mode: static
          value: 198.18.20.10
        default_route: true
        ipv6: manual
      backend:
        network: secondary
        slot: 1
        mac: 02:00:00:21:00:10
        address:
          mode: static
          value: 198.18.21.10
        ipv6: manual
    resources:
      memory_mib: 4096
    root_paths:
      data:
        path: /srv/example/apps
    compose_projects:
      broker:
        name: fixture-broker
        file: compose-broker.yml
    network_policy:
    - policy: selected_external
      endpoints:
        outpost:
          external: outpost
apps:
  broker:
    profile: broker
    guest: resolver
    lifecycle: retained
    identity:
      phase: broker
      runtime_id: fixture-broker
      project: broker
      services:
        mqtt: owned-broker
      networks: {}
      runtime_directory: /opt/homelab-app/runtime/broker
    interfaces:
      backend_interface:
        interface: backend
      frontend_interface:
        interface: management
    storage:
      config:
        root_path: data
        subpath: broker/config
      data:
        root_path: data
        subpath: broker/data
      log:
        root_path: data
        subpath: broker/log
    secrets:
      probe: probe
    properties:
      password_file: /mosquitto/config/passwords
  browser:
    profile: browser
    guest: resolver
    lifecycle: fresh
    interfaces:
      web_interface:
        interface: backend
      broker_interface:
        interface: backend
      private_interface:
        scope: app-network
        network: explorer
    storage:
      data:
        root_path: data
        subpath: browser
    origin:
      exposure: browser
    properties:
      connection_name: Saved source broker
  ingress:
    profile: ingress
    guest: resolver
    lifecycle: fresh
    interfaces:
      frontend_interface:
        interface: management
    storage:
      certs:
        root_path: data
        subpath: ingress
    secrets:
      cloudflare_dns_token: dns_api
      proxmox_token: provider
    properties:
      dashboard: false
      provider:
        context: lab
        token_id: fixture@pve!discovery
      acme:
        email: fixture@example.invalid
        resolvers:
        - external: dns
domains:
  browser: browser.example.invalid
  broker: broker.example.invalid
policies:
  tls:
    public:
      type: acme
      resolver: letsencrypt
  network:
    selected_external:
      rules:
      - direction: out
        proto: tcp
        destination:
          endpoint: outpost
        port:
          endpoint: outpost
        comment: Selected synthetic outpost
  middlewares:
    headers:
      type: default-headers
    office_only:
      type: ip-allow-list
      ranges:
      - address_group: clients
exposures:
  browser:
    type: http
    target:
      app: browser
      endpoint: web_endpoint
    domain: browser
    ingress:
      app: ingress
      endpoint: https_endpoint
    tls: public
    middlewares:
    - headers
    - office_only
connections:
  broker:
    consumer:
      app: browser
      connection: broker
    target:
      app: broker
      endpoint: backend_endpoint
    source_interface: broker_interface
    hostname:
      domain: broker
    account: client
  outpost:
    consumer:
      app: browser
      connection: outpost
    target:
      external: outpost
    source_interface: web_interface
accounts:
  client:
    adapter: mqtt-client
    owner: browser
    target:
      app: broker
      endpoint: backend_endpoint
    principal: browser
    credential: browser_password
    access: read-write-all
    lifecycle: create-once
address_groups:
  vpn:
    members:
    - 198.18.15.0/28
  clients:
    members:
    - network: primary
    - address_group: vpn
