---
- name: Read only the accepted pgAdmin verify through its fixed source
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Refuse a Proxmox host target
      ansible.builtin.stat:
        path: /etc/pve
      register: pgadmin_pve_directory

    - name: Require one original Debian application identity and a closed read-only request
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'db-tools'
          - app.vmid | type_debug == 'int'
          - app.vmid >= 100
          - app.vmid not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not pgadmin_pve_directory.stat.exists
          - pgadmin_service_binding is mapping
          - pgadmin_service_result_path is string
          - pgadmin_service_result_path is match('^/')
          - not ansible_check_mode
        fail_msg: 'Select the admitted existing db-tools guest and a single-purpose read-only request.'

    - name: Read the guest user namespace mapping
      ansible.builtin.slurp:
        src: /proc/self/uid_map
      register: pgadmin_uid_map

    - name: Refuse a privileged or host-root-mapped container
      ansible.builtin.assert:
        that:
          - (pgadmin_uid_map.content | b64decode) is search('(?m)^\s*0\s+[1-9][0-9]*\s+[1-9][0-9]*\s*$')
          - (pgadmin_uid_map.content | b64decode) is not search('(?m)^\s*[0-9]+\s+0\s+[1-9][0-9]*\s*$')

    - name: Record the active Docker daemon without changing it
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      register: pgadmin_docker_before
      changed_when: false
      failed_when: >-
        'ActiveState=active' not in pgadmin_docker_before.stdout_lines or
        pgadmin_docker_before.stdout is not search('(?m)^MainPID=[1-9][0-9]*$')

    - name: Check private controller result custody before the read
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os,stat,sys
            from pathlib import Path
            path=Path(sys.argv[1])
            assert path.is_absolute() and '..' not in path.parts
            assert path.parent.resolve(strict=True)==path.parent
            info=path.parent.stat()
            assert info.st_uid==os.getuid() and stat.S_IMODE(info.st_mode)==0o700
            assert not path.exists() and not path.is_symlink()
          - '{{ pgadmin_service_result_path }}'
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Run only the fixed read-only verify entry point without installing guest files
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys,types
            adapter=types.ModuleType('pgadmin_endpoint')
            exec({{ lookup('ansible.builtin.file', playbook_dir + '/../pgadmin_endpoint.py') | to_json }},adapter.__dict__)
            sys.modules['pgadmin_endpoint']=adapter
            runtime=types.ModuleType('pgadmin_database_runtime')
            exec({{ lookup('ansible.builtin.file', playbook_dir + '/../pgadmin_database_runtime.py') | to_json }},runtime.__dict__)
            sys.modules['pgadmin_database_runtime']=runtime
            exec({{ lookup('ansible.builtin.file', playbook_dir + '/../pgadmin_service_verify.py') | to_json }},{'__name__':'__main__'})
        stdin: "{{ {'app': app, 'binding': pgadmin_service_binding} | to_json }}"
        stdin_add_newline: false
      register: pgadmin_runtime_result
      changed_when: false
      timeout: 300
      no_log: true

    - name: Verify the Docker daemon was not restarted by a component phase
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      register: pgadmin_docker_after
      changed_when: false
      failed_when: pgadmin_docker_after.stdout != pgadmin_docker_before.stdout

    - name: Require a successful structured component result
      ansible.builtin.assert:
        that:
          - (pgadmin_runtime_result.stdout | from_json).status == 'passed'
          - (pgadmin_runtime_result.stdout | from_json).kind == 'pgadmin-accepted-service'
      no_log: true

    - name: Save only new private controller metadata in caller custody
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,os,stat,sys
            from pathlib import Path
            path=Path(sys.argv[1])
            assert path.is_absolute() and '..' not in path.parts
            assert path.parent.resolve(strict=True)==path.parent
            parent=os.open(path.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
            try:
                info=os.fstat(parent)
                assert info.st_uid==os.getuid() and stat.S_IMODE(info.st_mode)==0o700
                data=sys.stdin.buffer.read(65537)
                assert len(data)<=65536 and json.loads(data)['status']=='passed'
                output=os.open(path.name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=parent)
                with os.fdopen(output,'wb') as stream:
                    stream.write(data);stream.flush();os.fsync(stream.fileno())
                os.fsync(parent)
            finally:
                os.close(parent)
          - '{{ pgadmin_service_result_path }}'
        stdin: '{{ pgadmin_runtime_result.stdout }}'
        stdin_add_newline: false
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
