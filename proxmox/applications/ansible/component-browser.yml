---
- name: Maintain only the approved watched Influx browser route
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Refuse a Proxmox host
      ansible.builtin.stat:
        path: /etc/pve
      register: browser_pve

    - name: Confirm the single commissioned ingress guest
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'ingress'
          - app.vmid | int == browser_settings.vmid | int
          - app.vmid | int >= 100
          - app.vmid | int not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not browser_pve.stat.exists

    - name: Read the exact original watched configuration
      ansible.builtin.slurp:
        src: /opt/homelab-app/runtime/shared.yml
      register: browser_original
      no_log: true
      when: not browser_verify_only

    - name: Check the original before retaining it in existing NAS custody
      ansible.builtin.assert:
        that:
          - browser_original.content | b64decode | hash('sha256') == browser_settings.shared_before_sha256
      no_log: true
      when: not browser_verify_only

    - name: Preserve the unchanged original before any guest configuration write
      ansible.builtin.copy:
        content: '{{ browser_original.content | b64decode }}'
        dest: '{{ browser_archive }}'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true
      when: not browser_verify_only

    - name: Read back the retained original before activation
      ansible.builtin.slurp:
        src: '{{ browser_archive }}'
      delegate_to: localhost
      become: false
      register: browser_retained
      no_log: true
      when: not browser_verify_only

    - name: Require exact NAS original readback
      ansible.builtin.assert:
        that:
          - browser_retained.content | b64decode | hash('sha256') == browser_settings.shared_before_sha256
      no_log: true
      when: not browser_verify_only

    - name: Prepare only the namespaced browser maintenance helper directory
      ansible.builtin.file:
        path: /opt/homelab-app/ingress-browser
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: not browser_verify_only

    - name: Install only the reviewed route helpers
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../{{ item }}'
        dest: '/opt/homelab-app/ingress-browser/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [component_browser.py, ingress_browser.py, component_image.py]
      when: not browser_verify_only

    - name: Bind the exact approved route settings
      ansible.builtin.copy:
        content: '{{ browser_settings | to_json }}'
        dest: /opt/homelab-app/ingress-browser/settings.json
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: not browser_verify_only

    - name: Install once or verify the maintained route without a restart
      ansible.builtin.include_tasks: component-browser-verify.yml
      when: browser_verify_only

    - name: Execute the bound route helper
      ansible.builtin.command:
        argv: "{{ ['python3', '/opt/homelab-app/ingress-browser/component_browser.py', '--settings', '/opt/homelab-app/ingress-browser/settings.json'] + (['--verify-only'] if browser_verify_only else []) }}"
      changed_when: not browser_verify_only
      no_log: true
