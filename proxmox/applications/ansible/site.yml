---
- name: Configure exactly one new application guest
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Check the selected new guest before changing it
      ansible.builtin.import_tasks: tasks/guard.yml

    - name: Require separately staged original radio data before installation
      ansible.builtin.import_tasks: tasks/zigbee-staged.yml
      when: app.kind == 'zigbee2mqtt'

    - name: Install exact packages without starting vendor services
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: Install exact packages without starting vendor services
      ansible.builtin.apt:
        name: "{{ app.packages }}"
        state: present
        update_cache: true
        allow_downgrade: false
        policy_rc_d: 101
        fail_on_autoremove: true
      when: not ansible_check_mode

    - name: Read back and record the package-created MariaDB identity
      ansible.builtin.include_tasks: tasks/database-package-account.yml
      vars:
        database_account_after_packages: true
      when: app.kind == 'mariadb' and app.database.account_mode | default('fixed') == 'package' and not ansible_check_mode

    - name: Prepare the private installation directory
      ansible.builtin.file:
        path: /opt/homelab-app
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install the capture restore helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../restore.py"
        dest: /opt/homelab-app/restore.py
        owner: root
        group: root
        mode: '0700'
      when: app.kind in ['dns', 'identity', 'ingress', 'automation', 'db-tools', 'bitwarden']

    - name: Restore frozen application data before starting services
      ansible.builtin.import_tasks: tasks/restore.yml
      when: app.kind in ['dns', 'identity', 'ingress', 'automation', 'db-tools', 'bitwarden']

    - name: Configure the native database guest
      ansible.builtin.import_tasks: tasks/database.yml
      when: app.kind in ['mariadb', 'postgresql', 'influxdb']

    - name: Prepare the clean PegaProx directories and database key
      ansible.builtin.import_tasks: tasks/pegaprox.yml
      when: app.kind == 'pegaprox'

    - name: Configure the application stack
      ansible.builtin.import_tasks: tasks/compose.yml
      when: app.kind in ['dns', 'identity', 'ingress', 'automation', 'db-tools', 'monitoring', 'pegaprox', 'bitwarden', 'zigbee2mqtt']

    - name: Adopt future commissioned guests through the same active agent tasks
      ansible.builtin.include_tasks: ../../common/ansible/zabbix-agent.yml
      vars:
        # guard.yml and trusted creation receipts already bind this new LXC.
        # Existing fleet/host updates require their previously recorded ID.
        zabbix_agent: "{{ app.zabbix_agent | combine({'hostname': app.hostname, 'address': app.address, 'machine_id': ansible_facts.machine_id, 'virtualization_type': 'lxc'}) }}"
      when: app.zabbix_agent is defined and app.start_services | default(false) | bool
