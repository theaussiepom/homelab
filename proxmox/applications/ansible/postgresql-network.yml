---
- name: Inspect or maintain only the selected existing PostgreSQL cluster
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Refuse a Proxmox host target
      ansible.builtin.stat:
        path: /etc/pve
      register: postgres_runtime_pve

    - name: Require the exact existing Debian database guest and closed operation
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'postgresql'
          - app.vmid | type_debug == 'int'
          - app.vmid >= 100
          - app.vmid not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not postgres_runtime_pve.stat.exists
          - postgres_runtime_mode in ['inspect', 'preflight', 'activate', 'verify']
          - not ansible_check_mode
        fail_msg: 'Use one existing Debian PostgreSQL LXC and a caller-admitted runtime operation.'

    - name: Match the request identity to the selected SSH target
      ansible.builtin.assert:
        that:
          - postgres_runtime_identity == {'vmid':app.vmid, 'hostname':app.hostname, 'address':app.address, 'mac':app.mac | lower}
          - postgres_runtime_output is match('^/var/lib/homelab-applications/' ~ (app.vmid | string) ~ '/database-network-[A-Za-z0-9_-]+/[A-Za-z0-9_-]+\.json$')
      vars:
        postgres_runtime_identity: "{{ postgres_runtime_request.identity if postgres_runtime_mode == 'inspect' else postgres_runtime_request.before.identity }}"
      no_log: true

    - name: Require the selected new endpoint to exist before activation or verification
      ansible.builtin.assert:
        that:
          - postgres_runtime_request.endpoint.address in ansible_facts.all_ipv4_addresses
          - postgres_runtime_request.endpoint.address in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('active', 'defined') | selectattr('active') | selectattr('ipv4', 'defined') | map(attribute='ipv4.address') | list)
      when: postgres_runtime_mode in ['activate', 'verify']
      no_log: true

    - name: Read the controller account without changing it
      ansible.builtin.command:
        argv: [id, -u]
      delegate_to: localhost
      become: false
      register: postgres_runtime_controller_uid
      changed_when: false

    - name: Inspect the caller-owned private output directory and unused receipt path
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ postgres_runtime_output | dirname }}"
        - "{{ postgres_runtime_output }}"
      delegate_to: localhost
      become: false
      register: postgres_runtime_custody
      no_log: true

    - name: Refuse unsafe local custody before contacting PostgreSQL
      ansible.builtin.assert:
        that:
          - postgres_runtime_custody.results[0].stat.isdir | default(false)
          - not postgres_runtime_custody.results[0].stat.islnk | default(false)
          - postgres_runtime_custody.results[0].stat.uid == postgres_runtime_controller_uid.stdout | int
          - postgres_runtime_custody.results[0].stat.mode == '0700'
          - not postgres_runtime_custody.results[1].stat.exists
          - not postgres_runtime_custody.results[1].stat.islnk | default(false)
      no_log: true

    - name: Run the reviewed bounded runtime helper without installing guest files
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../postgres_network_runtime.py') }}"
          - "{{ postgres_runtime_mode }}"
        stdin: "{{ postgres_runtime_request | to_json }}"
      register: postgres_runtime_result
      changed_when: postgres_runtime_mode == 'activate'
      no_log: true

    - name: Preserve the private result only in caller-owned controller custody
      ansible.builtin.copy:
        dest: "{{ postgres_runtime_output }}"
        content: "{{ postgres_runtime_result.stdout }}\n"
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read back the exact private controller receipt
      ansible.builtin.stat:
        path: "{{ postgres_runtime_output }}"
        follow: false
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: postgres_runtime_saved
      no_log: true

    - name: Require the caller receipt to contain this operation's exact result
      ansible.builtin.assert:
        that:
          - postgres_runtime_saved.stat.isreg | default(false)
          - not postgres_runtime_saved.stat.islnk | default(false)
          - postgres_runtime_saved.stat.uid == postgres_runtime_controller_uid.stdout | int
          - postgres_runtime_saved.stat.mode == '0600'
          - postgres_runtime_saved.stat.checksum == ((postgres_runtime_result.stdout ~ '\n') | hash('sha256'))
      no_log: true
