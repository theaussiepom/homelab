---
- name: Update only the selected running ingress image
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Refuse a Proxmox host or another guest
      ansible.builtin.stat:
        path: /etc/pve
      register: pve_directory

    - name: Confirm the existing Debian ingress identity
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'ingress'
          - app.vmid | int >= 100
          - app.vmid | int not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not pve_directory.stat.exists

    - name: Require both effective ingress network dependencies
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item.0 }}', '--property={{ item.1 }}', --value]
      loop: "{{ ['docker.service', 'homelab-ingress-routing.service'] | product(['Requires', 'After']) | list }}"
      register: component_dependency
      changed_when: false
      failed_when: "'homelab-network-ready.service' not in component_dependency.stdout.split()"

    - name: Record Docker and routing service processes
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, homelab-ingress-routing.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      changed_when: false
      register: component_services_before

    - name: Install the shared bounded image updater
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../component_image.py'
        dest: /opt/homelab-app/component-image.py
        owner: root
        group: root
        mode: '0600'
      when: not component_verify_only

    - name: Update or verify only the selected component image
      ansible.builtin.command:
        argv: "{{ ['python3', '/opt/homelab-app/component-image.py', '--vmid', app.vmid | string, '--before', component_before, '--after', component_after, '--compose-sha256', component_compose_sha256] + (['--verify-only'] if component_verify_only else []) }}"
      register: component_update
      changed_when: not component_verify_only
      no_log: true

    - name: Verify neither Docker nor routing was restarted
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, homelab-ingress-routing.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      changed_when: false
      register: component_services_after
      failed_when: component_services_after.stdout != component_services_before.stdout
