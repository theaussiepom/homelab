---
- name: Verify the unchanged ingress runtime after its firewall addition
  hosts: application
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read installed ingress identity
      ansible.builtin.slurp:
        src: /etc/homelab-application.json
      register: identity
    - name: Require the commissioned ingress identity
      ansible.builtin.assert:
        that:
          - (identity.content | b64decode | from_json).vmid == app.vmid
          - (identity.content | b64decode | from_json).kind == 'ingress'
          - (identity.content | b64decode | from_json).hostname == app.hostname
    - name: Read unchanged runtime and Compose hashes
      ansible.builtin.stat:
        path: '{{ item.path }}'
        follow: false
        checksum_algorithm: sha256
      loop:
        - {path: /opt/homelab-app/runtime/traefik.yml, checksum: '{{ ingress_settings.runtime_sha256 }}'}
        - {path: /opt/homelab-app/compose.yml, checksum: '{{ ingress_settings.compose_sha256 }}'}
      register: retained_file
      failed_when: not retained_file.stat.isreg or retained_file.stat.islnk or retained_file.stat.checksum != item.checksum
    - name: Require the existing Traefik container to remain running
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/homelab-app/compose.yml, ps, --status, running, --services, traefik]
      changed_when: false
      register: running
      failed_when: running.stdout | trim != 'traefik'
