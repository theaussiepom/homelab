---
- name: Deploy this guest's monitoring agent once after its applications
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Verify this guest and its separately prepared data
      ansible.builtin.import_tasks: tasks/guest-ready.yml

    - name: Require the selected root monitoring contract
      ansible.builtin.assert:
        that: app.monitoring is defined

    - name: Configure this guest's monitoring agent
      ansible.builtin.include_tasks: tasks/monitoring-agent.yml
