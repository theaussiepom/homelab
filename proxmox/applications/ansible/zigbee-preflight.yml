---
- name: Check admitted radio state before ordinary infrastructure or packages
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require the exact admitted radio guest
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'zigbee2mqtt'
          - app.usb_stage == 'attached'
          - app.capture is not defined
          - app.zigbee_first_start_approval is not defined
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
    - name: Inspect the admitted checker and immutable admission receipts
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - {path: /opt/homelab-app/zigbee2mqtt.py, digest: "{{ app.zigbee_admission.checker_sha256 }}", mode: '0700'}
        - {path: /opt/homelab-app/restore.json, digest: "{{ app.zigbee_admission.restore_receipt_sha256 }}", mode: '0600'}
        - {path: /opt/homelab-app/zigbee-admission.json, digest: "{{ app.zigbee_admission.admission_receipt_sha256 }}", mode: '0600'}
      register: radio_admitted_files
      no_log: true
    - name: Preserve every separately admitted receipt and checker
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.uid == 0
          - item.stat.mode == item.item.mode
          - item.stat.checksum == item.item.digest
        fail_msg: 'The admitted checker or receipt changed; ordinary CD cannot repair or replace admission.'
      loop: "{{ radio_admitted_files.results }}"
      no_log: true
    - name: Require the existing live radio identity without first-start permission
      ansible.builtin.command:
        argv: [python3, /opt/homelab-app/zigbee2mqtt.py, --config, /opt/homelab-app/zigbee.json, --directory, /srv/homelab/data/zigbee2mqtt, --admission-receipt, /opt/homelab-app/zigbee-admission.json, --restore-receipt, /opt/homelab-app/restore.json, --capture-sha256, "{{ app.zigbee_admission.capture_sha256 }}", --selection-sha256, "{{ app.zigbee_admission.selection_sha256 }}", --require-admission]
      changed_when: false
      no_log: true
