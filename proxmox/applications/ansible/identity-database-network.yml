---
- name: Inspect or maintain only the existing Authentik SQL clients
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    identity_runtime_app: "{{ {'kind':app.kind, 'vmid':app.vmid, 'hostname':app.hostname, 'address':app.address, 'mac':app.mac | lower} }}"
    identity_runtime_program: |
      import sys, types
      _identity = types.ModuleType('identity_database')
      exec(compile({{ lookup('ansible.builtin.file', playbook_dir ~ '/../identity_database.py') | to_json }}, '<pinned-identity-database>', 'exec'), _identity.__dict__)
      sys.modules['identity_database'] = _identity
      exec(compile({{ lookup('ansible.builtin.file', playbook_dir ~ '/../identity_database_runtime.py') | to_json }}, '<pinned-identity-runtime>', 'exec'), {'__name__':'__main__'})
  tasks:
    - name: Refuse a Proxmox host target
      ansible.builtin.stat:
        path: /etc/pve
      register: identity_runtime_pve

    - name: Require one exact existing Debian Authentik guest and finite action
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'identity'
          - app.vmid | type_debug == 'int'
          - app.vmid >= 100
          - app.vmid not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not identity_runtime_pve.stat.exists
          - database_network_action in ['inspect', 'preflight', 'quiesce', 'activate', 'verify']
          - database_network_request is mapping
          - not ansible_check_mode
          - database_network_result_path is match('^/var/lib/homelab-applications/' ~ (app.vmid | string) ~ '/database-network-[A-Za-z0-9_-]+/[A-Za-z0-9_-]+\.json$')

    - name: Bind the finite runtime request to this original SSH target
      ansible.builtin.assert:
        that: database_network_request.app == identity_runtime_app
      when: database_network_action != 'inspect'
      no_log: true

    - name: Read the controller account without changing it
      ansible.builtin.command:
        argv: [id, -u]
      delegate_to: localhost
      become: false
      register: identity_runtime_controller_uid
      changed_when: false

    - name: Inspect caller-owned private output custody
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ database_network_result_path | dirname }}"
        - "{{ database_network_result_path }}"
      delegate_to: localhost
      become: false
      register: identity_runtime_custody
      no_log: true

    - name: Refuse unsafe custody or an existing result before running the helper
      ansible.builtin.assert:
        that:
          - identity_runtime_custody.results[0].stat.isdir | default(false)
          - not identity_runtime_custody.results[0].stat.islnk | default(false)
          - identity_runtime_custody.results[0].stat.uid == identity_runtime_controller_uid.stdout | int
          - identity_runtime_custody.results[0].stat.mode == '0700'
          - not identity_runtime_custody.results[1].stat.exists
          - not identity_runtime_custody.results[1].stat.islnk | default(false)
      no_log: true

    - name: Run pinned source bytes without installing a guest helper
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ identity_runtime_program }}", "{{ database_network_action }}"]
        stdin: "{{ {'app':identity_runtime_app, 'request':database_network_request} | to_json }}"
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
      register: identity_runtime_result
      changed_when: database_network_action in ['quiesce', 'activate']
      no_log: true

    - name: Require an explicit successful result for the selected phase
      ansible.builtin.assert:
        that:
          - (identity_runtime_result.stdout | from_json).status == 'passed'
          - (identity_runtime_result.stdout | from_json).action == database_network_action
          - (identity_runtime_result.stdout | from_json).changed == (database_network_action in ['quiesce', 'activate'])
      no_log: true

    - name: Save only the private result in caller-owned controller custody
      ansible.builtin.copy:
        dest: "{{ database_network_result_path }}"
        content: "{{ identity_runtime_result.stdout }}\n"
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read back the exact private result
      ansible.builtin.stat:
        path: "{{ database_network_result_path }}"
        follow: false
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: identity_runtime_saved
      no_log: true

    - name: Require this phase's exact private controller result
      ansible.builtin.assert:
        that:
          - identity_runtime_saved.stat.isreg | default(false)
          - not identity_runtime_saved.stat.islnk | default(false)
          - identity_runtime_saved.stat.uid == identity_runtime_controller_uid.stdout | int
          - identity_runtime_saved.stat.mode == '0600'
          - identity_runtime_saved.stat.checksum == ((identity_runtime_result.stdout ~ '\n') | hash('sha256'))
      no_log: true
