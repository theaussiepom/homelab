---
- name: Prepare this guest's PBS client
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Check guest identity
      ansible.builtin.import_tasks: tasks/component-ready.yml

    - name: Prepare the finite PBS client helpers
      ansible.builtin.import_tasks: tasks/backup-client.yml

    - name: Configure the selected recovery job
      ansible.builtin.import_tasks: tasks/backup-job.yml
      when: backup_agent.credentials is defined
