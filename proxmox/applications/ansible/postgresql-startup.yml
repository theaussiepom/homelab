---
- name: Reconcile startup ordering on one installed PostgreSQL guest
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Check that this is not a Proxmox host
      ansible.builtin.stat:
        path: /etc/pve
      register: pve_directory

    - name: Require the selected existing PostgreSQL guest and cluster
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'postgresql'
          - app.vmid | int >= 100
          - app.vmid | int not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not pve_directory.stat.exists
          - postgresql_cluster_unit is match('^postgresql@[0-9]+-[a-z][a-z0-9_]*\.service$')
        fail_msg: 'Select one existing Debian PostgreSQL LXC and its reviewed cluster service.'

    - name: Inspect existing network startup definitions before the approved correction
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/homelab-network-ready.service
        - /etc/systemd/system/postgresql@.service.d/homelab-network-ready.conf
      register: previous_network_startup

    - name: Preserve any pre-existing network startup definition for review
      ansible.builtin.assert:
        that: not item.stat.exists
      loop: "{{ previous_network_startup.results }}"

    - name: Install the same network startup definition used for new guests
      ansible.builtin.import_tasks: ../../common/ansible/network-ready.yml
      vars:
        network_ready_unit: postgresql@.service

    - name: Restart only the selected PostgreSQL cluster after the definition changes
      ansible.builtin.systemd_service:
        name: "{{ postgresql_cluster_unit }}"
        state: restarted
      when: (network_ready_gate.changed or network_ready_dependency.changed) and not ansible_check_mode
