---
- name: Order the installed ingress routing helper after its network gate
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Check that this is not a Proxmox host
      ansible.builtin.stat:
        path: /etc/pve
      register: pve_directory

    - name: Require the selected existing ingress guest
      ansible.builtin.assert:
        that:
          - groups['application'] | length == 1
          - app.kind == 'ingress'
          - app.vmid | int >= 100
          - app.vmid | int not in [900, 4914, 4915, 4920]
          - app.hostname == ansible_facts.hostname
          - app.address in ansible_facts.all_ipv4_addresses
          - app.mac | lower in (ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | map(attribute='macaddress') | map('lower') | list)
          - ansible_facts.virtualization_type == 'lxc'
          - ansible_facts.distribution == 'Debian'
          - not pve_directory.stat.exists

    - name: Read the existing network gate and routing service identities
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
      loop:
        - /etc/systemd/system/homelab-network-ready.service
        - /etc/systemd/system/homelab-ingress-routing.service
        - /etc/systemd/system/homelab-ingress-routing.service.d/homelab-network-ready.conf
      register: routing_startup_files

    - name: Match the reviewed existing units before changing startup ordering
      ansible.builtin.assert:
        that:
          - routing_startup_files.results[0].stat.isreg | default(false)
          - routing_startup_files.results[0].stat.checksum | default('') == network_ready_gate_sha256
          - routing_startup_files.results[1].stat.isreg | default(false)
          - routing_startup_files.results[1].stat.checksum | default('') == routing_unit_sha256
          - not routing_startup_files.results[2].stat.exists

    - name: Require both installed ingress services to be active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, '{{ item }}']
      loop: [docker.service, homelab-ingress-routing.service]
      changed_when: false

    - name: Record both service processes before the dependency change
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, homelab-ingress-routing.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      register: routing_services_before
      changed_when: false

    - name: Prepare the routing service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/homelab-ingress-routing.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Require the same successful network gate before routing setup
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-ingress-routing.service.d/homelab-network-ready.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Requires=homelab-network-ready.service
          After=homelab-network-ready.service

    - name: Reload definitions without restarting either service
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Verify neither ingress service restarted
      ansible.builtin.command:
        argv: [systemctl, show, docker.service, homelab-ingress-routing.service, '--property=MainPID,ActiveEnterTimestampMonotonic,ActiveState']
      register: routing_services_after
      changed_when: false
      failed_when: routing_services_after.stdout != routing_services_before.stdout

    - name: Verify the effective routing dependency and order
      ansible.builtin.command:
        argv: [systemctl, show, homelab-ingress-routing.service, '--property={{ item }}', --value]
      loop: [Requires, After]
      register: routing_relation
      changed_when: false
      failed_when: "'homelab-network-ready.service' not in routing_relation.stdout.split()"
