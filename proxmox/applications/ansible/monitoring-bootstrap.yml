---
# Called only by the bootstrap CD job, with a separately admitted host SSH key.
# API user/token setup is monitoring_access.initialize under that same CD hold.
- name: Install the Proxmox host agent through bootstrap CD
  hosts: monitoring_bootstrap
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require the pinned Proxmox node rather than the Ubuntu boot
      ansible.builtin.stat:
        path: /etc/pve/nodes/{{ ansible_facts.hostname }}
      register: monitoring_pve_node

    - name: Refuse an unready or unexpected host
      ansible.builtin.assert:
        that:
          - monitoring_pve_node.stat.isdir | default(false)
          - zabbix_agent.virtualization_type != 'lxc'
          - monitoring_host_node == ansible_facts.hostname

    - name: Use the same active agent installation as commissioned guests
      ansible.builtin.import_tasks: ../../common/ansible/zabbix-agent.yml
