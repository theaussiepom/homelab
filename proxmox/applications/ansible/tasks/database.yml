---
- name: Require pinned native database binaries and server configuration
  ansible.builtin.assert:
    that:
      - app.database.version_pattern | length > 0
      - app.database.version_command | length > 0
      - app.database.config_files | length > 0
      - app.capture is not defined
      - app.database.capture is not defined
    fail_msg: 'Database CD prepares the server only. Restore existing databases separately before starting their applications.'

- name: Check the installed database version without changing it
  ansible.builtin.command:
    argv: "{{ app.database.version_command }}"
  register: database_version
  changed_when: false
  failed_when: app.database.version_pattern not in database_version.stdout
  when: not ansible_check_mode

- name: Limit database configuration to its guest configuration directory
  ansible.builtin.assert:
    that:
      - item.destination is match('^/etc/(mysql|postgresql|influxdb)/[A-Za-z0-9_./-]+$')
      - "'..' not in item.destination.split('/')"
  loop: "{{ app.database.config_files }}"

- name: Install the selected database configuration
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "{{ app.database.user }}"
    group: "{{ app.database.group }}"
    mode: '0600'
    backup: true
  loop: "{{ app.database.config_files }}"
  no_log: true

- name: Start and enable only the selected native database server
  ansible.builtin.systemd_service:
    name: "{{ {'mariadb': 'mariadb', 'postgresql': 'postgresql', 'influxdb': 'influxdb'}[app.kind] }}"
    state: started
    enabled: true
  when: app.start_services | default(false) | bool and not ansible_check_mode
