---
- name: Require pinned native database binaries and server configuration
  ansible.builtin.assert:
    that:
      - app.database.version_pattern | length > 0
      - app.database.version_command | length > 0
      - app.database.config_files | length > 0
      - app.capture is not defined
      - app.database.capture is not defined
    fail_msg: 'Database CD prepares the server only. Restore existing databases separately before starting their applications.'

- name: Check the installed database version without changing it
  ansible.builtin.command:
    argv: "{{ app.database.version_command }}"
  register: database_version
  changed_when: false
  failed_when: app.database.version_pattern not in database_version.stdout
  when: not ansible_check_mode

- name: Limit database configuration to its guest configuration directory
  ansible.builtin.assert:
    that:
      - item.destination is match('^/etc/(mysql|postgresql|influxdb)/[A-Za-z0-9_./-]+$')
      - "'..' not in item.destination.split('/')"
  loop: "{{ app.database.config_files }}"

- name: Install the declared native database administrator lifecycle
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../database-admin-runtime.py"
    dest: /usr/local/bin/homelab-database-admin.py
    owner: root
    group: root
    mode: '0700'
  when: app.database_administrators is defined

- name: Check owned administrator identities before database configuration changes
  ansible.builtin.command:
    argv: [python3, /usr/local/bin/homelab-database-admin.py, --preflight]
    stdin: "{{ {'engine': app.kind, 'account': item.value, 'credential': (lookup('ansible.builtin.file', item.value.credential_file) | from_json)} | to_json }}"
  loop: "{{ app.database_administrators | default({}) | dict2items }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Install the selected database configuration
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "{{ app.database.user }}"
    group: "{{ app.database.group }}"
    mode: '0600'
    backup: true
  loop: "{{ app.database.config_files }}"
  no_log: true
  register: database_configuration

- name: Prepare guest networking before native database startup
  ansible.builtin.import_tasks: ../../../common/ansible/network-ready.yml
  vars:
    network_ready_unit: "{{ {'postgresql': 'postgresql@.service', 'mariadb': 'mariadb.service', 'influxdb': 'influxdb.service'}[app.kind] }}"
    network_ready_activate: "{{ app.start_services | default(false) | bool }}"

- name: Start and enable only the selected native database server
  ansible.builtin.systemd_service:
    name: "{{ {'mariadb': 'mariadb', 'postgresql': 'postgresql', 'influxdb': 'influxdb'}[app.kind] }}"
    state: "{{ 'restarted' if application_reconcile | default(false) | bool and database_configuration.changed else 'started' }}"
    enabled: true
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Verify only declared TLS server-administrator accounts
  ansible.builtin.command:
    argv: [python3, /usr/local/bin/homelab-database-admin.py]
    stdin: "{{ {'engine': app.kind, 'account': item.value, 'credential': (lookup('ansible.builtin.file', item.value.credential_file) | from_json)} | to_json }}"
  loop: "{{ app.database_administrators | default({}) | dict2items }}"
  changed_when: false
  no_log: true
  when: app.start_services | default(false) | bool and not ansible_check_mode
