---
- name: Install the owned controller schedule
  when: backup_controller is defined
  delegate_to: localhost
  become: false
  environment: '{{ backup_controller.environment }}'
  block:
    - name: Verify existing account-owned schedule ancestors
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('file', playbook_dir + '/../backup_source.py') }}"
          - '{{ item }}'
      loop:
        - '{{ backup_controller.base }}'
        - '{{ backup_controller.base }}/schedules'
        - '{{ backup_controller.unit_directory }}'
      changed_when: false

    - name: Verify existing public source ancestors before copying
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('file', playbook_dir + '/../backup_source.py') }}"
          - '{{ backup_controller.directory }}'
      changed_when: false

    - name: Inspect the selected immutable controller source
      ansible.builtin.stat:
        path: '{{ backup_controller.directory }}'
        follow: false
      register: backup_bundle_before

    - name: Refuse an unexpected existing controller bundle
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('file', playbook_dir + '/../backup_source.py') }}"
          - '{{ backup_controller.directory }}'
          - '{{ backup_controller.source_hash }}'
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
      when: backup_bundle_before.stat.exists
      changed_when: false

    - name: Prepare immutable framework directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: '{{ backup_controller.user }}'
        mode: '0700'
      loop: '{{ backup_controller_directories }}'

    - name: Copy the selected public framework generation
      ansible.builtin.copy:
        src: '{{ item.source }}'
        dest: '{{ item.destination }}'
        owner: '{{ backup_controller.user }}'
        mode: '0444'
        follow: false
      loop: '{{ backup_controller_files }}'
      when: not backup_bundle_before.stat.exists

    - name: Verify the complete installed framework source
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('file', playbook_dir + '/../backup_source.py') }}"
          - '{{ backup_controller.directory }}'
          - '{{ backup_controller.source_hash }}'
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
      changed_when: false

    - name: Inspect existing schedule ownership
      ansible.builtin.stat:
        path: '{{ backup_controller.unit_directory }}/{{ backup_controller.name }}.service'
        follow: false
      register: backup_service_before

    - name: Inspect schedule ownership record
      ansible.builtin.stat:
        path: '{{ backup_controller.owner_path }}'
        follow: false
      register: backup_schedule_owner_before

    - name: Inspect the existing timer
      ansible.builtin.stat:
        path: '{{ backup_controller.unit_directory }}/{{ backup_controller.name }}.timer'
        follow: false
      register: backup_timer_before

    - name: Inspect the group configuration
      ansible.builtin.stat:
        path: '{{ backup_controller.group_path }}'
        follow: false
      register: backup_group_before

    - name: Refuse an unowned existing schedule
      ansible.builtin.assert:
        that:
          - backup_service_before.stat.exists == backup_schedule_owner_before.stat.exists
          - backup_timer_before.stat.exists == backup_schedule_owner_before.stat.exists
          - backup_group_before.stat.exists == backup_schedule_owner_before.stat.exists
          - not backup_group_before.stat.exists or (backup_group_before.stat.isreg and not backup_group_before.stat.islnk and backup_group_before.stat.nlink == 1 and backup_group_before.stat.uid == backup_controller.user and backup_group_before.stat.mode == '0600')
          - not backup_service_before.stat.exists or (backup_service_before.stat.isreg and not backup_service_before.stat.islnk and backup_service_before.stat.nlink == 1 and backup_service_before.stat.uid == backup_controller.user and backup_service_before.stat.mode == '0644')
          - not backup_timer_before.stat.exists or (backup_timer_before.stat.isreg and not backup_timer_before.stat.islnk and backup_timer_before.stat.nlink == 1 and backup_timer_before.stat.uid == backup_controller.user and backup_timer_before.stat.mode == '0644')
          - not backup_schedule_owner_before.stat.exists or (backup_schedule_owner_before.stat.isreg and not backup_schedule_owner_before.stat.islnk and backup_schedule_owner_before.stat.nlink == 1 and backup_schedule_owner_before.stat.uid == backup_controller.user and backup_schedule_owner_before.stat.mode == '0600')

    - name: Read an existing schedule owner
      ansible.builtin.slurp:
        src: '{{ backup_controller.owner_path }}'
      register: backup_schedule_owner
      when: backup_schedule_owner_before.stat.exists
      no_log: true

    - name: Preserve schedule owner identity
      ansible.builtin.assert:
        that: (backup_schedule_owner.content | b64decode | from_json) == backup_controller.owner
      when: backup_schedule_owner_before.stat.exists
      no_log: true

    - name: Prepare protected schedule ownership
      ansible.builtin.file:
        path: '{{ backup_controller.base }}/schedules'
        state: directory
        owner: '{{ backup_controller.user }}'
        mode: '0700'

    - name: Record schedule ownership
      ansible.builtin.copy:
        content: '{{ backup_controller.owner | to_json }}'
        dest: '{{ backup_controller.owner_path }}'
        owner: '{{ backup_controller.user }}'
        mode: '0600'
        force: false
        follow: false

    - name: Prepare the proposed group for membership validation
      ansible.builtin.tempfile:
        state: file
        prefix: homelab-backup-group-
      register: backup_group_candidate

    - name: Validate and install the coordinated membership
      block:
        - name: Write the private group candidate
          ansible.builtin.copy:
            content: '{{ backup_controller.configuration | to_json }}'
            dest: '{{ backup_group_candidate.path }}'
            owner: '{{ backup_controller.user }}'
            mode: '0600'
          no_log: true

        - name: Refuse silent removal or movement of protected members
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - >-
                import sys; sys.path.insert(0, sys.argv[1]);
                import backup_controller;
                from private_io import read_json;
                backup_controller.continuity(read_json(sys.argv[2]), read_json(sys.argv[3]))
              - '{{ backup_controller.directory }}'
              - '{{ backup_controller.group_path }}'
              - '{{ backup_group_candidate.path }}'
          when: backup_group_before.stat.exists
          changed_when: false
          environment:
            PYTHONDONTWRITEBYTECODE: '1'
          no_log: true

        - name: Install the private group descriptor for the existing CD actor
          ansible.builtin.copy:
            src: '{{ backup_group_candidate.path }}'
            remote_src: true
            dest: '{{ backup_controller.group_path }}'
            owner: '{{ backup_controller.user }}'
            mode: '0600'
            follow: false
          no_log: true
      always:
        - name: Remove only the own group candidate
          ansible.builtin.file:
            path: '{{ backup_group_candidate.path }}'
            state: absent

    - name: Verify existing user units before changing declarations
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - --user
          - show
          - '{{ backup_controller.name }}.{{ item }}'
          - --property=FragmentPath
          - --property=DropInPaths
          - --property=NeedDaemonReload
      loop: [service, timer]
      register: backup_loaded_before
      when: backup_service_before.stat.exists
      changed_when: false

    - name: Refuse an unexpected effective user unit
      ansible.builtin.assert:
        that:
          - item.stderr == ''
          - item.stdout_lines | sort == (['FragmentPath=' + backup_controller.unit_directory + '/' + backup_controller.name + '.' + item.item, 'DropInPaths=', 'NeedDaemonReload=no'] | sort)
      loop: '{{ backup_loaded_before.results }}'
      when: backup_service_before.stat.exists

    - name: Prepare the actor-owned user unit directory
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - '{{ backup_controller.unit_directory | dirname | dirname }}'
        - '{{ backup_controller.unit_directory | dirname }}'
        - '{{ backup_controller.unit_directory }}'

    - name: Install the bounded recovery service
      ansible.builtin.copy:
        content: '{{ backup_controller.service }}'
        dest: '{{ backup_controller.unit_directory }}/{{ backup_controller.name }}.service'
        owner: '{{ backup_controller.user }}'
        mode: '0644'
        follow: false

    - name: Install the recovery timer
      ansible.builtin.copy:
        content: '{{ backup_controller.timer }}'
        dest: '{{ backup_controller.unit_directory }}/{{ backup_controller.name }}.timer'
        owner: '{{ backup_controller.user }}'
        mode: '0644'
        follow: false

    - name: Enable the declared schedule without running a backup during CD
      ansible.builtin.systemd_service:
        name: '{{ backup_controller.name }}.timer'
        scope: user
        daemon_reload: true
        enabled: true
        state: started
