---
- name: Query the selected Bitwarden schema as its retained account before application start
  ansible.builtin.command:
    argv:
      - timeout
      - '20'
      - mariadb
      - --no-defaults
      - --protocol=TCP
      - "--host={{ bitwarden_settings.database_server }}"
      - "--user={{ bitwarden_environment.BW_DB_USERNAME }}"
      - "--database={{ bitwarden_settings.database_name }}"
      - --connect-timeout=8
      - --batch
      - --skip-column-names
      - --execute
      - 'SELECT 1 FROM `{{ bitwarden_settings.database_name }}`.`Cipher` LIMIT 0; SELECT 1;'
  environment:
    MYSQL_PWD: "{{ bitwarden_environment.BW_DB_PASSWORD }}"
  register: bitwarden_database_query
  changed_when: false
  failed_when: bitwarden_database_query.rc != 0 or bitwarden_database_query.stdout | trim != '1'
  no_log: true
  when: not ansible_check_mode
