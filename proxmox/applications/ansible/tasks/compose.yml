---
- name: Require guest networking before Docker and application startup
  ansible.builtin.import_tasks: ../../../common/ansible/network-ready.yml
  vars:
    network_ready_unit: docker.service

- name: Prepare frontend reply routing for the multihomed ingress guest
  ansible.builtin.import_tasks: ingress-routing.yml
  when: app.kind == 'ingress' and app.frontend_routing is defined and not ansible_check_mode

- name: Enable the isolated guest Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Read this guest stack from private controller inputs
  ansible.builtin.set_fact:
    stack: "{{ lookup('ansible.builtin.file', app.stack_config) | from_json }}"
  no_log: true

- name: Verify stack kind and memory match the selected guest
  ansible.builtin.assert:
    that:
      - stack.kind == app.kind
      - stack.guest_memory_mib | int == app.memory_mib | int
      - stack.guest_memory_mib | int <= ansible_facts.memtotal_mb | int + 64

- name: Render private stack files on the controller
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../render.py", --config, "{{ app.stack_config }}", --output, "{{ app.render_dir }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Copy rendered stack without logging credentials
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/compose.yml"
    dest: /opt/homelab-app/compose.yml
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: not ansible_check_mode

- name: Install PegaProx's first-start stack without a host listener
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/compose-bootstrap.yml"
    dest: /opt/homelab-app/compose-bootstrap.yml
    owner: root
    group: root
    mode: '0600'
  when: app.kind == 'pegaprox' and not ansible_check_mode

- name: Read the generated foundation runtime file list
  ansible.builtin.set_fact:
    foundation_runtime_files: "{{ lookup('ansible.builtin.file', app.render_dir + '/runtime-files.json') | from_json }}"
  no_log: true
  when: (stack.foundation is defined or app.kind == 'monitoring') and not ansible_check_mode

- name: Prepare the private foundation runtime directory
  ansible.builtin.file:
    path: /opt/homelab-app/runtime
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: (stack.foundation is defined or app.kind == 'monitoring') and not ansible_check_mode

- name: Install only the selected service-readable foundation files
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/{{ item.path }}"
    dest: "/opt/homelab-app/runtime/{{ item.path }}"
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "{{ item.mode }}"
  loop: "{{ foundation_runtime_files | default([]) }}"
  no_log: true
  when: (stack.foundation is defined or app.kind == 'monitoring') and not ansible_check_mode

- name: Prepare the directory for generated ingress routes
  ansible.builtin.file:
    path: /srv/homelab/data/traefik/dynamic
    state: directory
  when: app.kind == 'ingress' and stack.foundation is not defined and not ansible_check_mode

- name: Validate the selected Proxmox CA before building its trust directory
  ansible.builtin.command:
    argv: [openssl, x509, -in, /opt/homelab-app/runtime/proxmox-ca.pem, -noout]
  changed_when: false
  when: app.kind == 'monitoring' and not ansible_check_mode

- name: Install only the new ingress routes into the restored Traefik file directory
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/routes.yml"
    dest: /srv/homelab/data/traefik/dynamic/homelab-applications.yml
    owner: root
    group: root
    mode: '0600'
    backup: true
  when: app.kind == 'ingress' and stack.foundation is not defined and not ansible_check_mode
  no_log: true

- name: Load preserved custom images by verified archive
  ansible.builtin.include_tasks: image.yml
  loop: "{{ stack.services | default({}) | dict2items | selectattr('value.archive', 'defined') | list }}"
  loop_control:
    loop_var: image_input
    label: "{{ image_input.key }}"

- name: Validate Compose without emitting private configuration
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/homelab-app/compose.yml, config, --quiet]
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Preserve Bitwarden image identity and install its health helper
  ansible.builtin.include_tasks: bitwarden.yml
  when: app.kind == 'bitwarden'

- name: Prepare the directory for the selected HA helper
  ansible.builtin.file:
    path: /srv/homelab/data/ha-startup
    state: directory
  when: app.kind == 'automation' and stack.services.homeassistant.environment.HOMELAB_HA_IPV4 is defined

- name: Adapt the existing HA helper to the selected rehearsal or production address
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mdns-route.sh"
    dest: /srv/homelab/data/ha-startup/mdns-route.sh
    owner: root
    group: root
    mode: '0750'
    backup: true
  when: app.kind == 'automation' and stack.services.homeassistant.environment.HOMELAB_HA_IPV4 is defined

- name: Install the read-only Zigbee state checker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../zigbee2mqtt.py"
    dest: /opt/homelab-app/zigbee2mqtt.py
    owner: root
    group: root
    mode: '0700'
  when: app.kind == 'zigbee2mqtt'

- name: Install only the selected Zigbee validation facts
  ansible.builtin.copy:
    content: "{{ stack.zigbee | to_nice_json }}"
    dest: /opt/homelab-app/zigbee.json
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: app.kind == 'zigbee2mqtt'

- name: Require the explicit start step and retired old writers
  ansible.builtin.assert:
    that:
      - app.start_services | default(false) | bool
      - app.exclusive_writer_confirmed | default(false) | bool or (app.kind == 'monitoring' and app.installation | default('') == 'clean')
    fail_msg: 'Data is staged. Start requires the selected cutover and exclusive-writer confirmation.'
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Check first-start admission or preserve the admitted live Zigbee identity
  ansible.builtin.command:
    argv: "{{ ['python3', '/opt/homelab-app/zigbee2mqtt.py', '--config', '/opt/homelab-app/zigbee.json', '--directory', '/srv/homelab/data/zigbee2mqtt', '--admission-receipt', '/opt/homelab-app/zigbee-admission.json', '--restore-receipt', '/opt/homelab-app/restore.json', '--capture-sha256', app.capture.sha256] + (['--admit-first-start'] if app.start_services | default(false) | bool else []) }}"
  register: zigbee_admission
  changed_when: zigbee_admission.rc == 0 and (zigbee_admission.stdout | from_json).admission_created
  no_log: true
  when: app.kind == 'zigbee2mqtt' and not ansible_check_mode

- name: Start exactly this guest stack
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '-f', ('/opt/homelab-app/compose-bootstrap.yml' if app.kind == 'pegaprox' else '/opt/homelab-app/compose.yml'), 'up', '-d', '--wait', '--wait-timeout', '180', '--remove-orphans=false'] + (['--pull', 'never'] if app.kind == 'bitwarden' else []) }}"
  register: compose_start
  changed_when: "'Started' in compose_start.stderr or 'Created' in compose_start.stderr or 'Recreated' in compose_start.stderr"
  no_log: true
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Initialise the clean PegaProx account after its first start
  ansible.builtin.import_tasks: pegaprox-bootstrap.yml
  when: app.kind == 'pegaprox'
