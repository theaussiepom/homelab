---
- name: Require guest networking before Docker and application startup
  ansible.builtin.import_tasks: ../../../common/ansible/network-ready.yml
  vars:
    network_ready_unit: docker.service

- name: Prepare frontend reply routing for the selected multihomed guest
  ansible.builtin.import_tasks: ingress-routing.yml
  when: app.kind in ['ingress', 'automation'] and app.frontend_routing is defined and not ansible_check_mode

- name: Enable the isolated guest Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Read this guest stack from private controller inputs
  ansible.builtin.set_fact:
    stack: "{{ lookup('ansible.builtin.file', app.stack_config) | from_json }}"
  no_log: true

- name: Verify stack kind and memory match the selected guest
  ansible.builtin.assert:
    that:
      - stack.kind == app.kind
      - stack.guest_memory_mib | int == app.memory_mib | int
      - stack.guest_memory_mib | int <= ansible_facts.memtotal_mb | int + 64

- name: Render private stack files on the controller
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../render.py", --config, "{{ app.stack_config }}", --output, "{{ app.render_dir }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Copy rendered stack without logging credentials
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/compose.yml"
    dest: /opt/homelab-app/compose.yml
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: not ansible_check_mode

- name: Read the generated foundation runtime file list
  ansible.builtin.set_fact:
    foundation_runtime_files: "{{ lookup('ansible.builtin.file', app.render_dir + '/runtime-files.json') | from_json }}"
  no_log: true
  when: stack.foundation is defined and not ansible_check_mode

- name: Prepare the private foundation runtime directory
  ansible.builtin.file:
    path: /opt/homelab-app/runtime
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: stack.foundation is defined and not ansible_check_mode

- name: Install only the selected service-readable foundation files
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/{{ item.path }}"
    dest: "/opt/homelab-app/runtime/{{ item.path }}"
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "{{ item.mode }}"
  loop: "{{ foundation_runtime_files | default([]) }}"
  no_log: true
  when: stack.foundation is defined and not ansible_check_mode

- name: Prepare the directory for generated ingress routes
  ansible.builtin.file:
    path: /srv/homelab/data/traefik/dynamic
    state: directory
  when: app.kind == 'ingress' and stack.foundation is not defined and not ansible_check_mode

- name: Install only the new ingress routes into the restored Traefik file directory
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/routes.yml"
    dest: /srv/homelab/data/traefik/dynamic/homelab-applications.yml
    owner: root
    group: root
    mode: '0600'
    backup: true
  when: app.kind == 'ingress' and stack.foundation is not defined and not ansible_check_mode
  no_log: true

- name: Load preserved custom images by verified archive
  ansible.builtin.include_tasks: image.yml
  loop: "{{ stack.services | dict2items | selectattr('value.archive', 'defined') | list }}"
  loop_control:
    loop_var: image_input
    label: "{{ image_input.key }}"

- name: Validate Compose without emitting private configuration
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/homelab-app/compose.yml, config, --quiet]
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Prepare the directory for the selected HA helper
  ansible.builtin.file:
    path: /srv/homelab/data/ha-startup
    state: directory
  when: app.kind == 'automation' and stack.services.homeassistant.environment.HOMELAB_HA_IPV4 is defined

- name: Adapt the existing HA helper to the selected rehearsal or production address
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mdns-route.sh"
    dest: /srv/homelab/data/ha-startup/mdns-route.sh
    owner: root
    group: root
    mode: '0750'
    backup: true
  when: app.kind == 'automation' and stack.services.homeassistant.environment.HOMELAB_HA_IPV4 is defined

- name: Require the explicit start step and retired old writers
  ansible.builtin.assert:
    that:
      - app.start_services | default(false) | bool
      - app.exclusive_writer_confirmed | default(false) | bool
    fail_msg: 'Data is staged. Start requires the selected cutover and exclusive-writer confirmation.'
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Install the native Node-RED OIDC wrapper without replacing restored settings
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../node-red-settings.js"
    dest: /srv/homelab/data/node-red/runtime-settings.js
    owner: '1000'
    group: '1000'
    mode: '0640'
  when: app.kind == 'automation' and stack.node_red_oidc is defined

- name: Adapt the Node-RED image health check to its current guest loopback listener
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../node-red-healthcheck.js"
    dest: /srv/homelab/data/node-red/healthcheck.js
    owner: '1000'
    group: '1000'
    mode: '0640'
    backup: true
  when: app.kind == 'automation'

- name: Install the bounded automation service probes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../automation-health.py"
    dest: /opt/homelab-app/automation-health.py
    owner: root
    group: root
    mode: '0700'
  when: app.kind == 'automation'

- name: Install the metadata-preserving HA proxy configurator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ha_http.py"
    dest: /opt/homelab-app/ha_http.py
    owner: root
    group: root
    mode: '0700'
  when: app.kind == 'automation' and app.ha_http is defined

- name: Configure the selected HA proxy before first application startup
  ansible.builtin.command:
    argv: "{{ ['python3', '/opt/homelab-app/ha_http.py', '--expected-sha256', app.ha_http.source_sha256, '--proxy', app.ha_http.trusted_proxy] + (['--http-store-sha256', app.ha_http.store_sha256] if app.ha_http.store_sha256 is defined else []) + (['--legacy-home-sha256', app.ha_legacy_sensor.homeassistant_sha256, '--legacy-command-sha256', app.ha_legacy_sensor.command_line_sha256] if app.ha_legacy_sensor is defined else []) }}"
  register: ha_proxy_configuration
  changed_when: (ha_proxy_configuration.stdout | from_json).changed
  when: app.kind == 'automation' and app.ha_http is defined and not ansible_check_mode
  no_log: true

- name: Start exactly this guest stack
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/homelab-app/compose.yml, up, -d, --wait, --wait-timeout, '180', --remove-orphans=false]
  register: compose_start
  changed_when: "'Started' in compose_start.stderr or 'Created' in compose_start.stderr or 'Recreated' in compose_start.stderr"
  no_log: true
  when: app.start_services | default(false) | bool and not ansible_check_mode
