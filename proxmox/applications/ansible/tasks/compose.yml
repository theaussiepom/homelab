---
- name: Read this guest stack from private controller inputs
  ansible.builtin.set_fact:
    stack: "{{ lookup('ansible.builtin.file', app.stack_config) | from_json }}"
  no_log: true

- name: Verify stack kind and memory match the selected guest
  ansible.builtin.assert:
    that:
      - stack.kind == app.kind
      - stack.guest_memory_mib | int == app.memory_mib | int
      - stack.guest_memory_mib | int <= ansible_facts.memtotal_mb | int + 64

- name: Render private stack files on the controller
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../render.py", --config, "{{ app.stack_config }}", --output, "{{ app.render_dir }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Copy rendered stack without logging credentials
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/compose.yml"
    dest: /opt/homelab-app/compose.yml
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: not ansible_check_mode

- name: Read the generated foundation runtime file list
  ansible.builtin.set_fact:
    foundation_runtime_files: "{{ lookup('ansible.builtin.file', app.render_dir + '/runtime-files.json') | from_json }}"
  no_log: true
  when: stack.foundation is defined and not ansible_check_mode

- name: Prepare the private foundation runtime directory
  ansible.builtin.file:
    path: /opt/homelab-app/runtime
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: stack.foundation is defined and not ansible_check_mode

- name: Install only the selected service-readable foundation files
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/{{ item.path }}"
    dest: "/opt/homelab-app/runtime/{{ item.path }}"
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "{{ item.mode }}"
  loop: "{{ foundation_runtime_files | default([]) }}"
  register: foundation_runtime_install
  no_log: true
  when: stack.foundation is defined and not ansible_check_mode

- name: Load preserved custom images by verified archive
  ansible.builtin.include_tasks: image.yml
  loop: "{{ app.image_archives | dict2items }}"
  when: app.kind not in ['automation', 'dns'] or image_input.key == application_service
  loop_control:
    loop_var: image_input
    label: "{{ image_input.key }}"

- name: Validate Compose without emitting private configuration
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/homelab-app/compose.yml, config, --quiet]
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Install the owned DNS record selection
  ansible.builtin.copy:
    src: "{{ app.render_dir }}/dns-records.json"
    dest: /opt/homelab-app/dns-records.json
    owner: root
    group: root
    mode: '0600'
  when: app.kind == 'dns' and application_service == 'pihole'

- name: Install the direct local DNS record checker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dns_records.py"
    dest: /opt/homelab-app/dns_records.py
    owner: root
    group: root
    mode: '0700'
  when: app.kind == 'dns' and application_service == 'pihole'

- name: Check the existing Zigbee configuration and coordinator before startup
  ansible.builtin.import_tasks: zigbee-runtime.yml
  when: app.kind == 'zigbee2mqtt'

- name: Preserve Bitwarden image identity and install its health helper
  ansible.builtin.include_tasks: bitwarden.yml
  when: app.kind == 'bitwarden'

- name: Require the explicit start step and retired old writers
  ansible.builtin.assert:
    that:
      - app.start_services | default(false) | bool
      - app.exclusive_writer_confirmed | default(false) | bool
    fail_msg: 'Data is staged. Start requires the selected cutover and exclusive-writer confirmation.'
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Install the bounded automation service probes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../automation-health.py"
    dest: /opt/homelab-app/automation-health.py
    owner: root
    group: root
    mode: '0700'
  when: app.kind == 'automation'

- name: Start exactly this guest stack
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '-f', '/opt/homelab-app/compose.yml', 'up', '-d', '--wait', '--wait-timeout', '180', '--remove-orphans=false'] + (['--force-recreate'] if foundation_runtime_install.changed | default(false) else []) + (['--pull', 'never'] if app.kind == 'bitwarden' else []) + (['--no-deps', application_service] if app.kind in ['automation', 'dns'] else []) }}"
  register: compose_start
  changed_when: "'Started' in compose_start.stderr or 'Created' in compose_start.stderr or 'Recreated' in compose_start.stderr"
  no_log: true
  when: app.start_services | default(false) | bool and not ansible_check_mode

- name: Reconcile owned Pi-hole records while retaining unrelated names
  ansible.builtin.command:
    argv: [python3, /opt/homelab-app/dns_records.py, reconcile, --records, /opt/homelab-app/dns-records.json, --compose, /opt/homelab-app/compose.yml]
  register: dns_record_reconcile
  changed_when: (dns_record_reconcile.stdout | from_json).changed
  when: app.kind == 'dns' and application_service == 'pihole' and not ansible_check_mode

- name: Reload only Pi-hole after its owned DNS records change
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/homelab-app/compose.yml, restart, --no-deps, pihole]
  when: app.kind == 'dns' and application_service == 'pihole' and not ansible_check_mode and dns_record_reconcile.changed
