---
- name: Install the typed identity callback helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../identity_callbacks.py"
    dest: /opt/homelab-app/identity_callbacks.py
    owner: root
    group: root
    mode: '0700'

- name: Install only the reviewed callback declaration
  ansible.builtin.copy:
    content: "{{ stack.foundation.allowed_callback_additions | to_json }}"
    dest: /opt/homelab-app/runtime/identity-callbacks.json
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Preserve the provider and append only its declared callback
  ansible.builtin.command:
    argv: [python3, /opt/homelab-app/identity_callbacks.py, --config, /opt/homelab-app/runtime/identity-callbacks.json, --compose, /opt/homelab-app/compose.yml]
  changed_when: false
  no_log: true
