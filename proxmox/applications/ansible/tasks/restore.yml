---
- name: Require a coherent capture and its private checksum
  ansible.builtin.assert:
    that:
      - app.capture.path is match('^/')
      - app.capture.sha256 is match('^[0-9a-f]{64}$')
      - app.capture.coherent | default(false) | bool
    fail_msg: 'Supply a coherent NAS capture, not an archive of live database files.'

- name: Upload only this guest capture
  ansible.builtin.copy:
    src: "{{ app.capture.path }}"
    dest: /opt/homelab-app/capture.tar
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Restore once into an empty guest data tree with numeric metadata
  ansible.builtin.command:
    argv:
      - python3
      - /opt/homelab-app/restore.py
      - --archive
      - /opt/homelab-app/capture.tar
      - --destination
      - /srv/homelab
      - --receipt
      - /opt/homelab-app/restore.json
      - --sha256
      - "{{ app.capture.sha256 }}"
  register: capture_restore
  changed_when: (capture_restore.stdout | from_json).restored
  when: not ansible_check_mode
