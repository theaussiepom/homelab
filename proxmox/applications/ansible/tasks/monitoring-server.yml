---
- name: Create private server configuration storage
  ansible.builtin.file:
    path: /var/lib/homelab-monitoring
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install the pinned server API configurator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring_configure.py"
    dest: /var/lib/homelab-monitoring/configure.py
    owner: root
    group: root
    mode: '0700'

- name: Install private server inputs and pinned templates
  ansible.builtin.copy:
    # Copy literal JSON bytes; Zabbix macros are not Ansible template syntax.
    src: "{{ monitoring_server_configuration_file }}"
    dest: /var/lib/homelab-monitoring/configure.json
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Configure templates and host linkage through the guest-local API
  ansible.builtin.command:
    argv: [python3, -I, -S, -B, /var/lib/homelab-monitoring/configure.py, --input, /var/lib/homelab-monitoring/configure.json]
  no_log: true

- name: Publish the frontend after the initial password and host configuration are complete
  ansible.builtin.copy:
    src: "{{ monitoring_compose_source | default(app.render_dir + '/compose.yml') }}"
    dest: "{{ monitoring_compose_file | default('/opt/homelab-app/compose.yml') }}"
    owner: root
    group: root
    mode: '0600'
  when: monitoring_first_install | default(false)
  no_log: true

- name: Start the configured browser listener
  ansible.builtin.command:
    argv: "{{ ['docker','compose','-f',monitoring_compose_file | default('/opt/homelab-app/compose.yml'),'up','-d','--wait','--wait-timeout','180','--remove-orphans=false'] + (['--no-deps'] + monitoring_services if monitoring_services is defined else []) }}"
  when: monitoring_first_install | default(false)
  no_log: true
