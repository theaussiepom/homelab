---
- name: Read numeric user identities before creating the database account
  ansible.builtin.getent:
    database: passwd

- name: Read numeric group identities before creating the database group
  ansible.builtin.getent:
    database: group

- name: Refuse existing account changes or numeric identity collisions
  ansible.builtin.assert:
    that:
      - app.database.uid | int > 0
      - app.database.gid | int > 0
      - app.database.user not in ansible_facts.getent_passwd or ansible_facts.getent_passwd[app.database.user][1] | int == app.database.uid | int
      - app.database.user not in ansible_facts.getent_passwd or ansible_facts.getent_passwd[app.database.user][2] | int == app.database.gid | int
      - app.database.group not in ansible_facts.getent_group or ansible_facts.getent_group[app.database.group][1] | int == app.database.gid | int
      - ansible_facts.getent_passwd | dict2items | rejectattr('key', 'equalto', app.database.user) | map(attribute='value') | map(attribute='1') | map('int') | select('equalto', app.database.uid | int) | list | length == 0
      - ansible_facts.getent_group | dict2items | rejectattr('key', 'equalto', app.database.group) | map(attribute='value') | map(attribute='1') | map('int') | select('equalto', app.database.gid | int) | list | length == 0
    fail_msg: 'Preserve existing numeric identities. Use a compatible fresh database guest; do not renumber another account or group.'

- name: Preserve the selected service group ID
  ansible.builtin.group:
    name: "{{ app.database.group }}"
    gid: "{{ app.database.gid }}"
    system: true

- name: Preserve the selected service user ID
  ansible.builtin.user:
    name: "{{ app.database.user }}"
    uid: "{{ app.database.uid }}"
    group: "{{ app.database.group }}"
    home: "{{ app.database.home }}"
    create_home: false
    system: true
    shell: /usr/sbin/nologin
