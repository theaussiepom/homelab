---
- name: Inspect the separately created radio restore receipt
  ansible.builtin.stat:
    path: /opt/homelab-app/restore.json
    follow: false
    checksum_algorithm: sha256
  register: zigbee_staged_receipt
  no_log: true

- name: Require the approved external restore before radio installation
  ansible.builtin.assert:
    that:
      - zigbee_staged_receipt.stat.isreg | default(false)
      - not zigbee_staged_receipt.stat.islnk | default(false)
      - zigbee_staged_receipt.stat.uid == 0
      - zigbee_staged_receipt.stat.mode == '0600'
      - app.zigbee_first_start_approval.approved | default(false) is sameas true
      - zigbee_staged_receipt.stat.checksum == app.zigbee_first_start_approval.restore_receipt_sha256
    fail_msg: 'Stage original radio data and its exact private restore receipt separately; CD never extracts it.'
  no_log: true

- name: Read only the bound external restore receipt
  ansible.builtin.slurp:
    src: /opt/homelab-app/restore.json
  register: zigbee_staged_value
  no_log: true

- name: Bind the external restore to this original capture and data destination
  ansible.builtin.assert:
    that:
      - (zigbee_staged_value.content | b64decode | from_json) == {'state':'complete','sha256':app.capture.sha256,'destination':'/srv/homelab/data'}
    fail_msg: 'Preserve the exact completed external radio restore; no automatic extraction or repair.'
  no_log: true
