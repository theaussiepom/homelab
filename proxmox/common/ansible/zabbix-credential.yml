---
# Controller-only helper. It never prints the key and never rotates an existing key.
- name: Commission the selected guest credential through its own CD path
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../monitoring_credentials.py", --provision, "{{ zabbix_agent.secret_provision_file }}", --hostname, "{{ zabbix_agent.hostname }}", --machine-id, "{{ zabbix_agent.machine_id }}"]
  delegate_to: localhost
  become: false
  when: zabbix_agent.secret_provision_file is defined
  changed_when: false

- name: Verify the credential's private file and commissioned machine binding
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/../monitoring_credentials.py", --check, "{{ zabbix_agent.credential_file }}", --hostname, "{{ zabbix_agent.hostname }}", --machine-id, "{{ zabbix_agent.machine_id }}"]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Resolve the same protected record used by Zabbix server CD
  ansible.builtin.set_fact:
    agent_credential: "{{ lookup('ansible.builtin.file', zabbix_agent.credential_file) | from_json }}"
  no_log: true

- name: Bind the public identity and private key to this guest
  ansible.builtin.set_fact:
    agent_psk_identity: "{{ agent_credential.psk_identity }}"
    agent_psk: "{{ agent_credential.psk }}"
  no_log: true
