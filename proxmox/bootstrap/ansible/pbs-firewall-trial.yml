---
- name: Create a private host-local trial directory
  ansible.builtin.tempfile:
    state: directory
    path: /run
    prefix: homelab-pbs-firewall.
  register: pbs_trial
- name: Stage the declared policy away from the boot file
  ansible.builtin.copy:
    content: '{{ pbs_firewall_admission.policy }}'
    dest: '{{ pbs_trial.path }}/desired.nft'
    mode: '0600'
- name: Stage the bounded rollback and persistence helper
  ansible.builtin.copy:
    src: pbs-firewall-trial
    dest: '{{ pbs_trial.path }}/trial'
    mode: '0600'
- name: Stage the service override for a clean first apply
  ansible.builtin.copy:
    content: '{{ pbs_firewall_admission.dropin }}'
    dest: '{{ pbs_trial.path }}/dropin'
    mode: '0600'
  when: pbs_firewall_admission.baseline == 'clean'
- name: Arm local rollback and try the new kernel policy
  ansible.builtin.command:
    argv:
      - /bin/bash
      - '{{ pbs_trial.path }}/trial'
      - apply
      - '{{ pbs_trial.path }}'
      - '{{ pbs_firewall_admission.previous_sha256 }}'
      - '{{ pbs_firewall_admission.desired_sha256 }}'
      - '{{ pbs_firewall_admission.baseline }}'
  changed_when: true
- name: Read the trial through fresh SSH with the existing boot policy
  ansible.builtin.include_tasks: pbs-firewall-read.yml
- name: Confirm trial rules, original boot file and network identity
  ansible.builtin.command:
    argv:
      - '{{ ansible_playbook_python }}'
      - -c
      - 'import json,sys; sys.path.insert(0,sys.argv[1]); import pbs_firewall as p; v=json.load(sys.stdin); p.inspect_trial(v["config"],v["facts"],v["baseline"]); print("Verified PBS trial through a fresh admitted connection")'
      - '{{ playbook_dir }}/..'
    stdin: '{{ {"config": pbs_firewall_desired, "facts": pbs_firewall_observed, "baseline": pbs_firewall_admission} | to_json }}'
  delegate_to: localhost
  become: false
  vars: {ansible_connection: local, ansible_become: false}
  changed_when: false
- name: Verify Management DNS with the trial policy active
  ansible.builtin.include_tasks: pbs-firewall-dns.yml
- name: Reconnect to the declared NAS over its Storage plane
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - 'import socket,sys; socket.create_connection((sys.argv[2],2049),5,(sys.argv[1],0)).close()'
      - '{{ pbs_firewall_desired.storage.address }}'
      - '{{ pbs_firewall_desired.storage.nfs_server }}'
  changed_when: false
- name: Make the verified trial policy persistent with rollback still armed
  ansible.builtin.command:
    argv:
      - /bin/bash
      - '{{ pbs_trial.path }}/trial'
      - persist
      - '{{ pbs_trial.path }}'
      - '{{ pbs_firewall_admission.previous_sha256 }}'
      - '{{ pbs_firewall_admission.desired_sha256 }}'
      - '{{ pbs_firewall_admission.baseline }}'
  changed_when: true
