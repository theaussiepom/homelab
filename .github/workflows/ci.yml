name: Validate HomeLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Select ISO checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      iso: ${{ steps.paths.outputs.iso }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 .github/scripts/ci_changes.py >> "$GITHUB_OUTPUT"
  monitoring:
    name: Clean Zabbix schema and active PSK fixture (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the existing pinned application test tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Install only verified upstream Zabbix API collections
        run: |
          mkdir -p "$RUNNER_TEMP/zabbix-collections"
          docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/zabbix-collections:/collections" homelab-app-test \
            python3 /src/proxmox/applications/monitoring/install-collections.py --output /collections
      - name: Test fresh schema, templates, idempotence and active PSK data
        run: |
          docker build --platform linux/amd64 -t homelab-zabbix-db-test:1 proxmox/applications/tests/monitoring-database
          python3 proxmox/applications/tests/monitoring_database_fixture.py
          python3 proxmox/applications/tests/monitoring_fixture.py \
            --collections "$RUNNER_TEMP/zabbix-collections" --output "$RUNNER_TEMP/zabbix-evidence"
      - name: Test the exact Debian13 Agent2 binary without network access
        run: |
          curl --fail --silent --show-error --max-time 120 \
            'https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix/zabbix-agent2_7.0.32-1%2Bdebian13_amd64.deb' \
            --output "$RUNNER_TEMP/zabbix-agent2.deb"
          docker run --rm --platform linux/amd64 --network none -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/zabbix-agent2.deb:/fixture-agent.deb:ro" homelab-app-test \
            python3 /src/proxmox/applications/tests/native_agent_fixture.py /fixture-agent.deb
  applications:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Application source and restore fixtures (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned source tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Check preserved Node-RED native login settings
        run: node --test proxmox/applications/tests/node-red-*.test.cjs
      - name: Test without network, host devices or deployment credentials
        run: |
          docker run --rm --platform linux/amd64 --network none --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            -v "$PWD:/src:ro" -e HOME=/tmp homelab-app-test \
            sh /src/proxmox/applications/tests/check.sh
      - name: Fetch the pinned PegaProx image explicitly
        run: docker pull --platform linux/amd64 ghcr.io/pegaprox/pegaprox@sha256:8d295a524a52f0b923616a3eb415ff6422fe62beba5bb441f35c75d8985f1add
      - name: Prove clean PegaProx login and password-free CD verification without network
        run: python3 proxmox/applications/tests/pegaprox_fixture.py
      - name: Rehearse the bootstrap with synthetic provider and runner fixtures
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            -v "$PWD:/src:ro" -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e ANSIBLE_LOCAL_TEMP=/tmp/ansible-local -e ANSIBLE_REMOTE_TEMP=/tmp/ansible-remote \
            homelab-app-test python3 /src/proxmox/bootstrap/bootstrap.py rehearse --evidence /tmp/evidence
      - name: Validate rendered stacks with Docker Compose
        run: |
          python3 proxmox/applications/tests/compose_fixture.py "$RUNNER_TEMP/app-compose"
          for kind in dns identity ingress automation db-tools; do
            docker compose -f "$RUNNER_TEMP/app-compose/$kind.json" config --quiet
          done
      - name: Prove symmetric frontend replies through an isolated stateful router
        run: |
          docker build --platform linux/amd64 --build-arg TOOLS_IMAGE=homelab-app-test -t homelab-routing-test:1 proxmox/applications/tests/routing
          python3 proxmox/applications/tests/ingress_routing_fixture.py --output "$RUNNER_TEMP/ingress-routing"
      - name: Exercise ingress aliases and login boundaries through pinned Traefik
        run: |
          docker pull --platform linux/amd64 traefik@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
          python3 proxmox/applications/tests/ingress_fixture.py
      - name: Prove the watched Influx browser overlay and native login headers
        run: |
          docker pull --platform linux/amd64 traefik@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
          python3 proxmox/applications/tests/ingress_browser_fixture.py
      - name: Fetch the exact service discovery fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NX211/traefik-proxmox-provider
          ref: e35cce5af139328b8e424836a0b32638ed777016
          path: provider-fixture-source
          persist-credentials: false
      - name: Exercise the pinned Proxmox provider over trusted HTTPS
        run: |
          curl --fail --silent --show-error --max-time 60 --max-filesize 1048576 \
            --user-agent 'Go-http-client/1.1' \
            https://plugins.traefik.io/public/download/github.com/NX211/traefik-proxmox-provider/v0.7.0 \
            --output "$RUNNER_TEMP/provider.zip"
          python3 proxmox/applications/tests/provider_fixture.py \
            --plugin-source provider-fixture-source --tools-image homelab-app-test \
            --plugin-archive "$RUNNER_TEMP/provider.zip"
      - name: Exercise a preserved pgAdmin profile and its HTTPS OAuth redirect
        run: |
          docker pull --platform linux/amd64 dpage/pgadmin4@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
          python3 proxmox/applications/tests/pgadmin_fixture.py
      - name: Admit the disposable hosted runner for the isolated privileged restart-policy fixture
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: python3 proxmox/applications/tests/pgadmin_restart_fixture.py --allow-disposable-github-runner
      - name: Exercise the selected DNS updates with synthetic offline records
        run: |
          docker pull --platform linux/amd64 pihole/pihole@sha256:70a9c11171ded2eee735d88c127996da209284a329d50f5ae59c06b861d401b3
          docker pull --platform linux/amd64 mvance/unbound@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
          python3 proxmox/applications/tests/foundation_dns_docker_fixture.py --output "$RUNNER_TEMP/foundation-dns"
          python3 proxmox/applications/tests/foundation_unbound_docker_fixture.py --output "$RUNNER_TEMP/foundation-unbound"
      - name: Exercise the pinned identity stack with file-backed secrets
        run: |
          docker pull --platform linux/amd64 ghcr.io/goauthentik/server@sha256:dc07e81b4462a1dad9c6720f4c73993e37d7cb2d2f94a306187318704d112e71
          docker pull --platform linux/amd64 redis@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
          docker pull --platform linux/amd64 postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
          python3 proxmox/applications/tests/identity_fixture.py
      - name: Exercise official Bitwarden Lite latest (intentionally floating) with synthetic MariaDB
        run: |
          docker pull --platform linux/amd64 ghcr.io/bitwarden/lite:latest
          docker pull --platform linux/amd64 mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
          python3 proxmox/applications/tests/bitwarden_fixture.py
      - name: Prove the selected PostgreSQL clean SQL adapter with synthetic databases
        run: |
          docker pull --platform linux/amd64 postgres@sha256:9d4951e6dc70422022512ff05ac86e0ae360da051c563accbed85d6f654c3357
          python3 proxmox/applications/tests/pg_fixture.py
      - name: Show bounded synthetic PostgreSQL diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.work/pg-clean-fixtures').glob('run-*/postgresql-clean.stderr')):
              print(path.name, flush=True)
              print(path.read_text()[:6000], flush=True)
          PY
  iso-unit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ISO source tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxmox/iso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker tools and run ISO source tests
        run: make tools init unit
      - name: Show ISO source-test receipts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for receipt in sorted(Path('evidence').glob('source-tests*.json')):
              print(receipt.name, flush=True)
              print(receipt.read_text(), flush=True)
          PY
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pytest -q tests --basetemp "$RUNNER_TEMP/pytest-homelab"
      - run: python -m pytest -q -p no:cacheprovider services/network-recovery
      - run: python bin/homelab validate --catalog examples/site/catalog/site.json
      - run: python bin/homelab plan --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab approve --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab apply --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab verify --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python tools/bootstrap-tools.py --directory .work/tools
      - run: python tools/native_tofu_fixture.py --tofu .work/tools/tofu --work .work/encryption
      - name: Validate OpenTofu configuration with backend initialization disabled
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_state_passphrase="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          for root in foundation critical application-guests security-vm; do
            .work/tools/tofu -chdir="infrastructure/proxmox/$root" init -backend=false -input=false -no-color -lockfile=readonly
            .work/tools/tofu -chdir="infrastructure/proxmox/$root" validate -no-color
          done
      - name: Check Ansible syntax without contacting inventory hosts
        working-directory: ansible
        run: |
          ansible-playbook -i localhost, --syntax-check playbooks/discover.yml
          ansible-playbook -i localhost, --syntax-check playbooks/prepare.yml
          ansible-playbook -i localhost, --syntax-check playbooks/verify.yml
  source-safety:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install verified scanner
        run: python .github/scripts/install_gitleaks.py "$RUNNER_TEMP/source-tools"
      - name: Exercise staged and history guards
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/source-tools/gitleaks
        run: |
          python -B -m unittest discover -s .githooks -p 'test_*.py'
          python -B -m unittest discover -s .github/scripts -p 'test_safety.py'
      - name: Check conditional ISO selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_ci_changes.py' -v
      - name: Scan complete trees, introduced history and maintainer identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/source_safety.py --head "$HEAD_SHA" --base "$BASE_SHA" --scanner "$RUNNER_TEMP/source-tools/gitleaks"
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  analyze:
    if: github.event_name != 'workflow_dispatch'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
  build-and-boot:
    needs: changes
    if: needs.changes.outputs.iso == 'true'
    name: ISO ${{ matrix.profile }} (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [fixture, integration]
    defaults:
      run:
        working-directory: proxmox/iso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker tools
        run: make tools
      - name: Run source tests
        run: make unit
      - name: Create invented integration inputs
        if: matrix.profile == 'integration'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          local = Path('.local')
          local.mkdir(mode=0o700, exist_ok=True)
          if any(local.iterdir()):
              raise SystemExit('CI integration inputs require a fresh empty .local directory')
          hardware = json.loads(Path('config/fixture-hardware.json').read_text())
          for field in ('schema', 'environment', 'runtime_sha256'):
              hardware.pop(field)
          hardware['machine_uuid'] = '44444444-4444-4444-8444-444444444444'
          for index, disk in enumerate(hardware['disk_members'] + hardware['protected_disks']):
              disk['disk_serial'] = 'CI-' + str(index)
              disk['disk_by_id'] = '/dev/disk/by-id/nvme-CI-' + str(index) + '_1'
          site = json.loads(Path('config/fixture-site.json').read_text())
          site['fqdn'] = 'pve.ci.example.org'
          site['mailto'] = 'operator@ci.example.org'
          approval = {'approved_by': 'CI invented-input build only', 'scope': 'build-and-prepare-removable-media-only', 'production_boot_or_erase_authorized': False}
          files = {name: (json.dumps(value, indent=2) + '\n').encode() for name, value in {'hardware.json': hardware, 'site.json': site, 'media-approval.json': approval}.items()}
          files['root-ssh.pub'] = Path('config/fixture-ssh.pub').read_bytes()
          files['root-recovery-password.hash'] = ('$6$synthetic$' + 'A' * 86 + '\n').encode()
          for name, data in files.items():
              fd = os.open(local / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(data)
          PY
      - name: Build practice image and run five guarded VM cases
        if: matrix.profile == 'fixture'
        run: make fetch fixture test-boot
      - name: Build invented-input integration image and check wrong-machine refusal
        if: matrix.profile == 'integration'
        run: make fetch build test-profile
      - name: Show build and boot evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patterns = (
              'evidence/source-tests*.json',
              'evidence/final-metadata-verification.json',
              'evidence/latest-build-command-failure.json',
              'build/single-usb-*/build-receipt.json',
              'build/single-usb-*/native-validation.txt',
              'build/single-usb-*/boot-record.txt',
              'build/vm-tests/*/receipt.json',
              'build/vm-tests/*/argv.json',
              'build/vm-tests/*/console.log',
          )
          for pattern in patterns:
              for path in sorted(Path('.').glob(pattern)):
                  print('Evidence:', path, flush=True)
                  print(path.read_text(errors='replace'), flush=True)
          PY
