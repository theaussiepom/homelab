name: Public synthetic validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  applications:
    name: Application source and restore fixtures (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned source tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Test without network, host devices or deployment credentials
        run: |
          docker run --rm --platform linux/amd64 --network none --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            -v "$PWD:/src:ro" -e HOME=/tmp homelab-app-test \
            sh /src/proxmox/applications/tests/check.sh
      - name: Rehearse the bootstrap with synthetic provider and runner fixtures
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            -v "$PWD:/src:ro" -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e ANSIBLE_LOCAL_TEMP=/tmp/ansible-local -e ANSIBLE_REMOTE_TEMP=/tmp/ansible-remote \
            homelab-app-test python3 /src/proxmox/bootstrap/bootstrap.py rehearse --evidence /tmp/evidence
      - name: Validate rendered stacks with Docker Compose
        run: |
          python3 proxmox/applications/tests/compose_fixture.py "$RUNNER_TEMP/app-compose"
          for kind in dns identity ingress automation db-tools; do
            docker compose -f "$RUNNER_TEMP/app-compose/$kind.json" config --quiet
          done
      - name: Prove symmetric frontend replies through an isolated stateful router
        run: |
          docker build --platform linux/amd64 --build-arg TOOLS_IMAGE=homelab-app-test -t homelab-routing-test:1 proxmox/applications/tests/routing
          python3 proxmox/applications/tests/ingress_routing_fixture.py --output "$RUNNER_TEMP/ingress-routing"
      - name: Exercise ingress aliases and login boundaries through pinned Traefik
        run: |
          docker pull --platform linux/amd64 traefik@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
          python3 proxmox/applications/tests/ingress_fixture.py
      - name: Fetch the exact service discovery fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NX211/traefik-proxmox-provider
          ref: e35cce5af139328b8e424836a0b32638ed777016
          path: provider-fixture-source
          persist-credentials: false
      - name: Exercise the pinned Proxmox provider over trusted HTTPS
        run: |
          curl --fail --silent --show-error --max-time 60 --max-filesize 1048576 \
            --user-agent 'Go-http-client/1.1' \
            https://plugins.traefik.io/public/download/github.com/NX211/traefik-proxmox-provider/v0.7.0 \
            --output "$RUNNER_TEMP/provider.zip"
          python3 proxmox/applications/tests/provider_fixture.py \
            --plugin-source provider-fixture-source --tools-image homelab-app-test \
            --plugin-archive "$RUNNER_TEMP/provider.zip"
      - name: Exercise a preserved pgAdmin profile and its HTTPS OAuth redirect
        run: |
          docker pull --platform linux/amd64 dpage/pgadmin4@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
          python3 proxmox/applications/tests/pgadmin_fixture.py
      - name: Exercise the selected DNS updates with synthetic offline records
        run: |
          docker pull --platform linux/amd64 pihole/pihole@sha256:70a9c11171ded2eee735d88c127996da209284a329d50f5ae59c06b861d401b3
          docker pull --platform linux/amd64 mvance/unbound@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
          python3 proxmox/applications/tests/foundation_dns_docker_fixture.py --output "$RUNNER_TEMP/foundation-dns"
          python3 proxmox/applications/tests/foundation_unbound_docker_fixture.py --output "$RUNNER_TEMP/foundation-unbound"
      - name: Exercise the pinned identity stack with file-backed secrets
        run: |
          docker pull --platform linux/amd64 ghcr.io/goauthentik/server@sha256:dc07e81b4462a1dad9c6720f4c73993e37d7cb2d2f94a306187318704d112e71
          docker pull --platform linux/amd64 redis@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
          docker pull --platform linux/amd64 postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
          python3 proxmox/applications/tests/identity_fixture.py
      - name: Exercise existing Bitwarden Lite with synthetic MariaDB and no external route
        run: |
          docker pull --platform linux/amd64 ghcr.io/bitwarden/lite@sha256:8b42485f544a5da4abcdc13ac10b38ca355bc4f0d5ab60efef4dcdf11e27a6f8
          docker pull --platform linux/amd64 mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
          python3 proxmox/applications/tests/bitwarden_fixture.py
      - name: Prove the selected PostgreSQL clean SQL adapter with synthetic databases
        run: |
          docker pull --platform linux/amd64 postgres@sha256:9d4951e6dc70422022512ff05ac86e0ae360da051c563accbed85d6f654c3357
          python3 proxmox/applications/tests/pg_fixture.py
      - name: Show bounded synthetic PostgreSQL diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.work/pg-clean-fixtures').glob('run-*/postgresql-clean.stderr')):
              print(path.name, flush=True)
              print(path.read_text()[:6000], flush=True)
          PY
  iso-unit:
    name: ISO source tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxmox/iso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker tools and run ISO source tests
        run: make tools init unit
      - name: Show ISO source-test receipts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for receipt in sorted(Path('evidence').glob('source-tests*.json')):
              print(receipt.name, flush=True)
              print(receipt.read_text(), flush=True)
          PY
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pytest -q tests --basetemp "$RUNNER_TEMP/pytest-homelab"
      - run: python -m pytest -q -p no:cacheprovider services/network-recovery
      - run: python bin/homelab validate --catalog examples/site/catalog/site.json
      - run: python bin/homelab plan --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab approve --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab apply --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python bin/homelab verify --catalog examples/site/catalog/site.json --workspace .work/rehearsal --target synthetic
      - run: python tools/bootstrap-tools.py --directory .work/tools
      - run: python tools/native_tofu_fixture.py --tofu .work/tools/tofu --work .work/encryption
      - name: Validate OpenTofu configuration with backend initialization disabled
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_state_passphrase="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          for root in foundation critical application-guests security-vm; do
            .work/tools/tofu -chdir="infrastructure/proxmox/$root" init -backend=false -input=false -no-color -lockfile=readonly
            .work/tools/tofu -chdir="infrastructure/proxmox/$root" validate -no-color
          done
      - name: Check Ansible syntax without contacting inventory hosts
        working-directory: ansible
        run: |
          ansible-playbook -i localhost, --syntax-check playbooks/discover.yml
          ansible-playbook -i localhost, --syntax-check playbooks/prepare.yml
          ansible-playbook -i localhost, --syntax-check playbooks/verify.yml
