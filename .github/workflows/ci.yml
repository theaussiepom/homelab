name: Validate HomeLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  blueprints:
    name: Guest blueprint contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned source tooling
        run: python3 -m pip install --require-hashes -r requirements.lock.txt
      - name: Check coverage measurement against known paths
        run: python3 -m pytest -q .github/scripts/test_coverage_metrics.py
      - name: Measure blueprint unit coverage
        run: python3 tools/measure_coverage.py --suite blueprints --output "$RUNNER_TEMP/blueprint-coverage"
  changes:
    name: Detect installer changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      iso: ${{ steps.paths.outputs.iso }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 .github/scripts/ci_changes.py >> "$GITHUB_OUTPUT"
  monitoring:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Clean Zabbix schema and active PSK fixture (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the existing pinned application test tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Install only verified upstream Zabbix API collections
        run: |
          mkdir -p "$RUNNER_TEMP/zabbix-collections"
          docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/zabbix-collections:/collections" homelab-app-test \
            python3 /src/proxmox/applications/monitoring/install-collections.py --output /collections
      - name: Test fresh schema, templates, idempotence and active PSK data
        run: |
          docker build --platform linux/amd64 -t homelab-zabbix-db-test:1 proxmox/applications/tests/monitoring-database
          python3 proxmox/applications/tests/monitoring_database_fixture.py
          python3 proxmox/applications/tests/monitoring_fixture.py \
            --collections "$RUNNER_TEMP/zabbix-collections" --output "$RUNNER_TEMP/zabbix-evidence"
      - name: Test the exact Debian13 Agent2 binary without network access
        run: |
          curl --fail --silent --show-error --max-time 120 \
            'https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix/zabbix-agent2_7.0.32-1%2Bdebian13_amd64.deb' \
            --output "$RUNNER_TEMP/zabbix-agent2.deb"
          docker run --rm --platform linux/amd64 --network none -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/zabbix-agent2.deb:/fixture-agent.deb:ro" homelab-app-test \
            python3 /src/proxmox/applications/tests/native_agent_fixture.py /fixture-agent.deb
  bitwarden-runtime:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Bitwarden startup and attachment persistence (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned source requirements
        run: python3 -m pip install --require-hashes -r requirements.lock.txt
      - name: Build pinned source test tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Fetch the selected synthetic runtime images
        run: |
          docker pull --platform linux/amd64 ghcr.io/bitwarden/lite:latest
          docker pull --platform linux/amd64 mariadb@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
      - name: Exercise current rendering, startup, restart and attachment preservation
        run: python3 proxmox/applications/tests/bitwarden_runtime_fixture.py
  retained-runtimes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: PegaProx and pgAdmin retained runtime (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned source requirements
        run: python3 -m pip install --require-hashes -r requirements.lock.txt
      - name: Build pinned source test tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - name: Fetch only the selected immutable application images
        run: |
          docker pull --platform linux/amd64 ghcr.io/pegaprox/pegaprox@sha256:8d295a524a52f0b923616a3eb415ff6422fe62beba5bb441f35c75d8985f1add
          docker pull --platform linux/amd64 dpage/pgadmin4@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
      - name: Preserve the separate PegaProx key and encrypted data through restart
        run: python3 proxmox/applications/tests/pegaprox_runtime_fixture.py
      - name: Start the retained pgAdmin profile without bootstrap credentials and check OIDC
        run: python3 proxmox/applications/tests/pgadmin_runtime_fixture.py
  applications:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Application contracts and runtime components (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned source tools
        run: docker build --platform linux/amd64 -t homelab-app-test -f proxmox/bootstrap/docker/Dockerfile proxmox/bootstrap/docker
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
      - name: Check preserved Node-RED runtime helpers
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 --test-coverage-include='**/proxmox/applications/node-red-*.js' proxmox/applications/tests/node-red-*.test.cjs
      - name: Test the current deployment contract and retained runtime components
        run: |
          docker run --rm --platform linux/amd64 --network none --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/application-coverage:/coverage" \
            -e HOME=/tmp -e HOMELAB_COVERAGE_OUTPUT=/coverage/report -e GITHUB_SHA homelab-app-test \
            sh /src/proxmox/applications/tests/check.sh
      - name: Show application coverage summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/application-coverage/report/summary.md"; then
            cat "$RUNNER_TEMP/application-coverage/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate current stack structure with Docker Compose
        run: |
          python3 proxmox/applications/tests/compose_fixture.py "$RUNNER_TEMP/app-compose"
          for kind in dns identity ingress automation db-tools zigbee2mqtt; do
            docker compose -f "$RUNNER_TEMP/app-compose/$kind.json" config --quiet
          done
      - name: Reconcile owned MQTT DNS records against the pinned Pi-hole image
        run: python3 proxmox/applications/tests/dns_records_fixture.py --output "$RUNNER_TEMP/service-dns-records"
      - name: Test the generated Zigbee health command without a coordinator
        run: python3 proxmox/applications/tests/zigbee_health_fixture.py
      - name: Exercise isolated frontend routing
        run: |
          docker build --platform linux/amd64 --build-arg TOOLS_IMAGE=homelab-app-test -t homelab-routing-test:1 proxmox/applications/tests/routing
          python3 proxmox/applications/tests/ingress_routing_fixture.py --output "$RUNNER_TEMP/ingress-routing"
      - name: Exercise the current Authentik runtime with synthetic credentials
        run: |
          docker pull --platform linux/amd64 ghcr.io/goauthentik/server@sha256:dc07e81b4462a1dad9c6720f4c73993e37d7cb2d2f94a306187318704d112e71
          docker pull --platform linux/amd64 redis@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
          docker pull --platform linux/amd64 postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
          python3 proxmox/applications/tests/identity_fixture.py
      - name: Fetch the exact service discovery fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NX211/traefik-proxmox-provider
          ref: e35cce5af139328b8e424836a0b32638ed777016
          path: provider-fixture-source
          persist-credentials: false
      - name: Exercise the pinned provider over trusted HTTPS
        run: |
          curl --fail --silent --show-error --max-time 60 --max-filesize 1048576 \
            --user-agent 'Go-http-client/1.1' \
            https://plugins.traefik.io/public/download/github.com/NX211/traefik-proxmox-provider/v0.7.0 \
            --output "$RUNNER_TEMP/provider.zip"
          python3 proxmox/applications/tests/provider_fixture.py \
            --plugin-source provider-fixture-source --tools-image homelab-app-test \
            --plugin-archive "$RUNNER_TEMP/provider.zip"
  iso-unit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ISO source tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxmox/iso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker tools and run ISO source tests
        run: make tools init unit
      - name: Show ISO source-test receipts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for receipt in sorted(Path('evidence').glob('source-tests*.json')):
              print(receipt.name, flush=True)
              print(receipt.read_text(), flush=True)
          PY
  python:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Python coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Install the pinned source scanner
        run: python .github/scripts/install_gitleaks.py "$RUNNER_TEMP/coverage-tools"
      - name: Measure all current framework Python code
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/coverage-tools/gitleaks
        run: python tools/measure_coverage.py --all --fail-under 100 --output "$RUNNER_TEMP/framework-coverage"
  source-safety:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install verified scanner
        run: python .github/scripts/install_gitleaks.py "$RUNNER_TEMP/source-tools"
      - name: Exercise staged and history guards
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/source-tools/gitleaks
        run: |
          python -B -m unittest discover -s .githooks -p 'test_*.py'
          python -B -m unittest discover -s .github/scripts -p 'test_safety.py'
      - name: Check conditional ISO selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_ci_changes.py' -v
      - name: Scan complete trees, introduced history and maintainer identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/source_safety.py --head "$HEAD_SHA" --base "$BASE_SHA" --scanner "$RUNNER_TEMP/source-tools/gitleaks"
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  analyze:
    if: github.event_name != 'workflow_dispatch'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
  installer-disk-safety:
    name: Installer disk safety
    needs: changes
    if: needs.changes.outputs.iso == 'true'
    uses: ./.github/workflows/installer-disk-safety.yml
  installer-config-validation:
    name: Installer config validation
    needs: changes
    if: needs.changes.outputs.iso == 'true'
    uses: ./.github/workflows/installer-config-validation.yml
  validate:
    name: Repository validation
    if: always() && github.event_name != 'schedule'
    needs: [blueprints, changes, monitoring, bitwarden-runtime, retained-runtimes, applications, iso-unit, python, source-safety, dependency-review, analyze, installer-disk-safety, installer-config-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          expected = {name: 'success' for name in jobs}
          expected['dependency-review'] = 'success' if os.environ['EVENT'] == 'pull_request' else 'skipped'
          if os.environ['EVENT'] == 'workflow_dispatch':
              for name in ('monitoring', 'bitwarden-runtime', 'retained-runtimes', 'applications', 'iso-unit', 'python', 'source-safety', 'analyze'):
                  expected[name] = 'skipped'
          selection = jobs['changes']['outputs'].get('iso')
          if selection not in {'true', 'false'}:
              raise SystemExit('Installer change selection is missing or invalid')
          applicable = selection == 'true'
          for name in ('installer-disk-safety', 'installer-config-validation'):
              expected[name] = 'success' if applicable else 'skipped'
              if applicable and jobs[name]['outputs'].get('qualified') != 'true':
                  raise SystemExit('Installer suite did not qualify all cases: ' + name)
          if not applicable:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Installer disk safety and Installer config validation skipped: no installer-relevant source changes.\n')
          failures = [name for name, result in jobs.items() if result['result'] != expected[name]]
          if failures: raise SystemExit('Required checks did not pass: ' + ', '.join(failures))
          PYCODE
