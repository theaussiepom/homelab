name: Source safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-safety-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install verified scanner
        run: python .github/scripts/install_gitleaks.py "$RUNNER_TEMP/source-tools"
      - name: Exercise staged and history guards
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/source-tools/gitleaks
        run: |
          python -B -m unittest discover -s .githooks -p 'test_*.py'
          python -B -m unittest discover -s .github/scripts -p 'test_safety.py'
      - name: Scan complete trees, introduced history and maintainer identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/source_safety.py --head "$HEAD_SHA" --base "$BASE_SHA" --scanner "$RUNNER_TEMP/source-tools/gitleaks"
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
