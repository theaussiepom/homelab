name: Source safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-safety-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified scanner
        run: python .github/scripts/install_gitleaks.py "$RUNNER_TEMP/source-tools"
      - name: Exercise staged and history guards
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/source-tools/gitleaks
        run: |
          python -B -m unittest discover -s .githooks -p 'test_*.py'
          python -B -m unittest discover -s .github/scripts -p 'test_safety.py'
      - name: Scan complete trees, introduced history and maintainer identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/source_safety.py --head "$HEAD_SHA" --base "$BASE_SHA" --scanner "$RUNNER_TEMP/source-tools/gitleaks"
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
