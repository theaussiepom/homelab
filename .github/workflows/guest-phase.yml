name: Run guest phase
on:
  workflow_call:
    inputs:
      disabled:
        type: string
        required: false
        default: '[]'
      runner_labels:
        type: string
        required: true
      environment_name:
        type: string
        required: true
      guest:
        type: string
        required: true
      phase:
        type: string
        required: true
    secrets:
      APPLICATION_SSH_KEY:
        required: true
      PROXMOX_APP_TOKEN:
        required: true
      authentik_postgresql_password:
        required: false
      authentik_secret_key:
        required: false
      authentik_smtp_password:
        required: false
      bitwarden_runtime_environment:
        required: false
      cloudbeaver_client_secret:
        required: false
      mqtt_explorer_broker_password:
        required: false
      mqtt_probe:
        required: false
      node_red_api_token:
        required: false
      pegaprox_database_key:
        required: false
      traefik_cloudflare_dns_token:
        required: false
      traefik_cloudflare_origin_token:
        required: false
      traefik_proxmox_token:
        required: false
      winet_options:
        required: false
      zabbix_database_password:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  run:
    name: Run
    if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(fromJSON(inputs.disabled || '[]'), inputs.guest)
    environment: ${{ inputs.environment_name }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 45
    env:
      HOMELAB_DEPLOYMENT_WORKFLOW: ${{ github.workflow_ref }}
    steps:
      - name: Preserve bootstrap custody
        run: |
          test ! -e /var/lib/homelab-bootstrap/CONFIGURING
          test ! -e /var/lib/homelab-bootstrap/BOOTSTRAP-CD-HOLD.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the private stack selection
        id: stack
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path('.github/workflows/deploy.yml').read_text()
          pins = re.findall(r'^(?:\s*uses:|  HOMELAB_STACK_SOURCE:) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/deploy\.yml@([0-9a-f]{40})\s*$', text, re.M)
          if len(pins) != 1: raise SystemExit('Select one immutable stack workflow')
          print('repository='+pins[0][0]); print('revision='+pins[0][1])
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.stack.outputs.repository }}
          ref: ${{ steps.stack.outputs.revision }}
          path: stack-source
          persist-credentials: false
      - name: Read the framework selection
        id: framework
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path('stack-source/.github/workflows/phase.yml').read_text()
          pins = re.findall(r'^\s*uses: ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/guest-phase\.yml@([0-9a-f]{40})\s*$', text, re.M)
          if len(pins) != 1: raise SystemExit('Select one immutable framework workflow')
          print('repository='+pins[0][0]); print('revision='+pins[0][1])
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.framework.outputs.repository }}
          ref: ${{ steps.framework.outputs.revision }}
          path: framework-source
          persist-credentials: false
      - name: Prepare config
        run: |
          umask 077
          config_env=$(mktemp -d "$RUNNER_TEMP/homelab-config-XXXXXX")
          python3 -m venv "$config_env"
          python3 - "$config_env/pyyaml.lock" <<'PYCODE'
          from pathlib import Path
          import re, sys
          lock = Path('framework-source/requirements.lock.txt')
          if lock.is_symlink() or not lock.is_file() or lock.stat().st_size > 1024 * 1024:
              raise SystemExit('Use the selected framework dependency lock')
          lines = lock.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith('pyyaml==')]
          if len(starts) != 1:
              raise SystemExit('Use one exact hash-locked authored config dependency')
          first = starts[0]
          block = [lines[first]]
          for line in lines[first + 1:]:
              if not line.startswith('    --hash='): break
              block.append(line)
          if (not re.fullmatch(r'pyyaml==[0-9]+(?:\.[0-9]+)+ \\', block[0]) or len(block) < 2
                  or any(not re.fullmatch(r'    --hash=sha256:[0-9a-f]{64} \\', line) for line in block[1:-1])
                  or not re.fullmatch(r'    --hash=sha256:[0-9a-f]{64}', block[-1])):
              raise SystemExit('Use one exact hash-locked authored config dependency')
          Path(sys.argv[1]).write_text('\n'.join(block) + '\n')
          PYCODE
          "$config_env/bin/python" -m pip --isolated install --disable-pip-version-check --require-hashes --no-deps -r "$config_env/pyyaml.lock"
          printf 'HOMELAB_CONFIG_PYTHON=%s/bin/python\n' "$config_env" >> "$GITHUB_ENV"
      - name: Compile the admitted guest
        env:
          GUEST: ${{ inputs.guest }}
          PHASE: ${{ inputs.phase }}
          DISABLED: ${{ inputs.disabled }}
        run: |
          umask 077
          "$HOMELAB_CONFIG_PYTHON" framework-source/blueprints/compile.py --stack stack-source --site-root . \
            --guest "$GUEST" --disabled "$DISABLED" --admit \
            --output "$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json"
      - name: Bind existing credentials
        env:
          GUEST: ${{ inputs.guest }}
          PHASE: ${{ inputs.phase }}
          PROXMOX_APP_TOKEN: ${{ secrets.PROXMOX_APP_TOKEN }}
          APPLICATION_SSH_KEY: ${{ secrets.APPLICATION_SSH_KEY }}
        run: python3 framework-source/blueprints/credentials.py --packet "$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json"
      - name: Reconcile this phase
        env:
          GUEST: ${{ inputs.guest }}
          PHASE: ${{ inputs.phase }}
          HOMELAB_APP_SECRET_AUTHENTIK_POSTGRESQL_PASSWORD: ${{ secrets.authentik_postgresql_password }}
          HOMELAB_APP_SECRET_AUTHENTIK_SECRET_KEY: ${{ secrets.authentik_secret_key }}
          HOMELAB_APP_SECRET_AUTHENTIK_SMTP_PASSWORD: ${{ secrets.authentik_smtp_password }}
          HOMELAB_APP_SECRET_BITWARDEN_RUNTIME_ENVIRONMENT: ${{ secrets.bitwarden_runtime_environment }}
          HOMELAB_APP_SECRET_CLOUDBEAVER_CLIENT_SECRET: ${{ secrets.cloudbeaver_client_secret }}
          HOMELAB_APP_SECRET_MQTT_EXPLORER_BROKER_PASSWORD: ${{ secrets.mqtt_explorer_broker_password }}
          HOMELAB_APP_SECRET_MQTT_PROBE: ${{ secrets.mqtt_probe }}
          HOMELAB_APP_SECRET_NODE_RED_API_TOKEN: ${{ secrets.node_red_api_token }}
          HOMELAB_APP_SECRET_PEGAPROX_DATABASE_KEY: ${{ secrets.pegaprox_database_key }}
          HOMELAB_APP_SECRET_TRAEFIK_CLOUDFLARE_DNS_TOKEN: ${{ secrets.traefik_cloudflare_dns_token }}
          HOMELAB_APP_SECRET_TRAEFIK_CLOUDFLARE_ORIGIN_TOKEN: ${{ secrets.traefik_cloudflare_origin_token }}
          HOMELAB_APP_SECRET_TRAEFIK_PROXMOX_TOKEN: ${{ secrets.traefik_proxmox_token }}
          HOMELAB_APP_SECRET_WINET_OPTIONS: ${{ secrets.winet_options }}
          HOMELAB_APP_SECRET_ZABBIX_DATABASE_PASSWORD: ${{ secrets.zabbix_database_password }}
        run: |
          # Elide only absent optional action defaults; preserve every supplied value.
          for app_secret_slot in HOMELAB_APP_SECRET_AUTHENTIK_POSTGRESQL_PASSWORD HOMELAB_APP_SECRET_AUTHENTIK_SECRET_KEY HOMELAB_APP_SECRET_AUTHENTIK_SMTP_PASSWORD HOMELAB_APP_SECRET_BITWARDEN_RUNTIME_ENVIRONMENT HOMELAB_APP_SECRET_CLOUDBEAVER_CLIENT_SECRET HOMELAB_APP_SECRET_MQTT_EXPLORER_BROKER_PASSWORD HOMELAB_APP_SECRET_MQTT_PROBE HOMELAB_APP_SECRET_NODE_RED_API_TOKEN HOMELAB_APP_SECRET_PEGAPROX_DATABASE_KEY HOMELAB_APP_SECRET_TRAEFIK_CLOUDFLARE_DNS_TOKEN HOMELAB_APP_SECRET_TRAEFIK_CLOUDFLARE_ORIGIN_TOKEN HOMELAB_APP_SECRET_TRAEFIK_PROXMOX_TOKEN HOMELAB_APP_SECRET_WINET_OPTIONS HOMELAB_APP_SECRET_ZABBIX_DATABASE_PASSWORD; do
            if [ -z "${!app_secret_slot}" ]; then unset "$app_secret_slot"; fi
          done
          exec python3 framework-source/proxmox/applications/deploy.py --phase "$PHASE" --packet "$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json"
