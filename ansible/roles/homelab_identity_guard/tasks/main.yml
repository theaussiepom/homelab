---
- name: Require a bound identity manifest rather than passing an empty verification
  ansible.builtin.assert:
    that:
      - homelab_identity_manifest_qualified | default(false) | bool
      - (homelab_expected_paths | length + homelab_expected_accounts | length) > 0
    fail_msg: "I08 identity manifest and actual path/account checks remain required."

- name: Require canonical numeric identities in the reviewed manifest
  ansible.builtin.assert:
    that:
      - item.uid is integer and item.uid >= 0
      - item.gid is integer and item.gid >= 0
    fail_msg: "Manifest UID/GID must be non-negative YAML integers; no implicit coercion."
  loop: "{{ homelab_expected_paths + homelab_expected_accounts }}"

- name: Require quoted four-digit octal path modes
  ansible.builtin.assert:
    that:
      - item.mode is string
      - item.mode is match('^[0-7]{4}$')
    fail_msg: "Manifest modes must be quoted four-digit octal strings, for example '0750'."
  loop: "{{ homelab_expected_paths }}"

- name: Read preserved numeric path metadata without following symlinks
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop: "{{ homelab_expected_paths }}"
  register: homelab_path_observations

- name: Refuse wrong or missing state instead of changing ownership
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - not item.stat.islnk
      - item.stat.uid == item.item.uid
      - item.stat.gid == item.item.gid
      - item.stat.mode == item.item.mode
    fail_msg: "Preserved state metadata differs; no chown/init fallback."
  loop: "{{ homelab_path_observations.results }}"
  loop_control:
    label: "{{ item.item.logical_id }}"

- name: Read existing accounts
  ansible.builtin.getent:
    database: passwd
  when: homelab_expected_accounts | length > 0

- name: Refuse a package/service account identity mismatch
  ansible.builtin.assert:
    that:
      - item.name in ansible_facts.getent_passwd
      - ansible_facts.getent_passwd[item.name][1] | int == item.uid
      - ansible_facts.getent_passwd[item.name][2] | int == item.gid
    fail_msg: "Native account does not preserve the required UID/GID; qualify before packages/restore."
  loop: "{{ homelab_expected_accounts }}"
