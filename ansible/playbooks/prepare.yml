---
- name: Prepare explicitly admitted stopped guests
  hosts: pve_guests
  gather_facts: false
  become: true
  serial: 1
  roles:
    - role: homelab_admission
    - role: homelab_identity_guard
    - role: homelab_native_packages
      when: homelab_native_packages | default([]) | length > 0
    - role: homelab_compose_stage
      when: homelab_compose_files | default([]) | length > 0
    - role: homelab_deploy_stage
      when: inventory_hostname == 'deploy'
